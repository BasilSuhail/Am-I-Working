<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily record entry demo</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --surface-2: #eeeeeb; --border: #dcdbd6;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --q1: #b7d3f6; --q2: #6da7ec; --q3: #2a78d6; --q4: #104281;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #2a2a28; --border: #3a3a37;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --q1: #104281; --q2: #1c5cab; --q3: #3987e5; --q4: #86b6ef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --surface-2: #2a2a28; --border: #3a3a37;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --q1: #104281; --q2: #1c5cab; --q3: #3987e5; --q4: #86b6ef;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-1); color: var(--text-primary); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
.badge { display: inline-block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
h1 { font-size: 20px; margin: 10px 0 16px; }
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; margin-left: auto; }
.seg button { font: inherit; font-size: 14px; cursor: pointer; background: transparent; color: var(--text-secondary); border: 0; padding: 6px 14px; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
.chart-scroll { overflow-x: auto; padding-bottom: 6px; }
.chart { position: relative; display: inline-block; min-width: 100%; }
.months { display: flex; margin-left: 34px; height: 18px; font-size: 12px; color: var(--text-muted); position: relative; }
.months span { position: absolute; }
.body { display: flex; }
.wd { display: grid; grid-template-rows: repeat(7, 22px); gap: 3px; width: 34px; font-size: 12px; color: var(--text-muted); }
.wd span { line-height: 22px; }
.grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 22px); grid-auto-columns: 22px; gap: 3px; }
.cell { width: 22px; height: 22px; border-radius: 4px; background: var(--surface-2); position: relative; outline-offset: 2px; }
.cell:focus-visible { outline: 2px solid var(--text-primary); }
.cell.today { box-shadow: 0 0 0 2px var(--text-primary); }
.cell.l1 { background: var(--q1); } .cell.l2 { background: var(--q2); } .cell.l3 { background: var(--q3); } .cell.l4 { background: var(--q4); }
.split .cell { background: var(--surface-2); padding: 3px; display: flex; flex-direction: column; justify-content: space-between; }
.split .cell.l1, .split .cell.l2, .split .cell.l3, .split .cell.l4 { background: var(--surface-2); }
.bar { height: 4px; border-radius: 2px; }
.bar.a { background: var(--s1); } .bar.b { background: var(--s2); } .bar.c { background: var(--s3); }
.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }
.ramp { display: inline-flex; gap: 3px; align-items: center; }
.ramp i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 22px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.stat.hero { border-color: var(--s3); }
.stat .n { font-size: 30px; font-weight: 650; line-height: 1.1; }
.stat .l { font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.adj { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.adj .tdy { flex: 1; text-align: center; font-size: 13px; color: var(--text-secondary); }
.adj .tdy b { color: var(--text-primary); font-size: 16px; }
.adj button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font: inherit; font-size: 20px; line-height: 1; cursor: pointer; }
.adj button:hover { background: var(--surface-2); }
.adj button:disabled { opacity: .35; cursor: default; }
.adj button:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.auto { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); text-align: center; }
.tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); min-width: 170px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.note { margin-top: 18px; color: var(--text-muted); font-size: 13px; }
@media (max-width: 520px) { .stat .n { font-size: 24px; } .stats { gap: 8px; } .stat { padding: 10px; } }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Demo, made up history</span>
  <h1>Daily record</h1>

  <div class="top">
    <div class="seg" role="group" aria-label="Chart view">
      <button id="vBlend" aria-pressed="true">Blend</button>
      <button id="vSplit" aria-pressed="false">Split</button>
    </div>
  </div>

  <div class="chart-scroll" id="chartScroll">
    <div class="chart" id="chart">
      <div class="months" id="months"></div>
      <div class="body">
        <div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="grid" id="grid" role="img" aria-label="Activity grid, 20 weeks"></div>
      </div>
    </div>
  </div>
  <div class="legend" id="legend"></div>

  <div class="stats" id="stats"></div>
  <div class="sr" id="live" role="status" aria-live="polite"></div>

  <p class="note">Demo only. Counts you change here stay in this browser. The real tracker saves them to a file on your server.</p>
</div>
<div class="tip" id="tip"></div>

<script>
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(2611);
  var WEEKS = 20, DAYS = WEEKS * 7;
  var end = Date.UTC(2026, 10, 8), start = end - (DAYS - 1) * 864e5;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var data = [];
  for (var i = 0; i < DAYS; i++) {
    var w = i % 7, vanish = (i > 78 && i < 83) || (i > 112 && i < 115), isToday = i === DAYS - 1;
    data.push({ d: new Date(start + i * 864e5),
      commits: vanish ? 0 : Math.floor(rand() * (w > 4 ? 9 : 5)),
      skool: !isToday && i > 118 ? (rand() < 0.7 ? 1 : 0) : 0,
      wins: !isToday && i > 124 && !vanish ? (rand() < 0.3 ? 1 : 0) : 0 });
  }
  var todayI = DAYS - 1, today = data[todayI];
  var caps = { commits: 8, skool: 2, wins: 2 }, split = false;

  function score(x) { return x.commits + x.skool * 3 + x.wins * 6; }
  function level(s) { return s === 0 ? 0 : s <= 3 ? 1 : s <= 7 ? 2 : s <= 12 ? 3 : 4; }
  function fmt(d) { return WD[(d.getUTCDay() + 6) % 7] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }

  var cells = [], grid = document.getElementById("grid"), tip = document.getElementById("tip");
  function paint(i) {
    var x = data[i], c = cells[i], keys = ["commits", "skool", "wins"], bars = c.querySelectorAll(".bar");
    c.className = "cell l" + level(score(x)) + (i === todayI ? " today" : "");
    c.setAttribute("aria-label", fmt(x.d) + ": " + x.commits + " commits, " + x.skool + " Skool, " + x.wins + " wins");
    for (var k = 0; k < 3; k++) {
      var v = x[keys[k]];
      bars[k].style.width = v ? Math.max(30, Math.min(100, v / caps[keys[k]] * 100)) + "%" : "0%";
      bars[k].style.display = split ? "block" : "none";
    }
  }
  data.forEach(function (x, i) {
    var c = document.createElement("div"); c.tabIndex = 0;
    ["a", "b", "c"].forEach(function (cl) { var b = document.createElement("div"); b.className = "bar " + cl; c.appendChild(b); });
    function show() {
      var r = c.getBoundingClientRect();
      tip.innerHTML = "<b>" + fmt(x.d) + (i === todayI ? " (today)" : "") + "</b>" +
        '<div><i class="dot" style="background:var(--s1)"></i>' + x.commits + " commits</div>" +
        '<div><i class="dot" style="background:var(--s2)"></i>' + x.skool + " Skool</div>" +
        '<div><i class="dot" style="background:var(--s3)"></i>' + x.wins + " wins</div>";
      tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = (r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + "px";
    }
    function hide() { tip.style.display = "none"; }
    c.addEventListener("pointerenter", show); c.addEventListener("pointerleave", hide);
    c.addEventListener("focus", show); c.addEventListener("blur", hide);
    cells.push(c); grid.appendChild(c); paint(i);
  });

  var months = document.getElementById("months"), lastM = -1;
  for (var wk = 0; wk < WEEKS; wk++) {
    var md = new Date(start + wk * 7 * 864e5);
    if (md.getUTCMonth() !== lastM) { var s = document.createElement("span"); s.textContent = MON[md.getUTCMonth()]; s.style.left = (wk * 25) + "px"; months.appendChild(s); lastM = md.getUTCMonth(); }
  }

  function sum(k) { return data.slice(-7).reduce(function (t, x) { return t + x[k]; }, 0); }
  function daysWith(k) { return data.slice(-7).filter(function (x) { return x[k] > 0; }).length; }
  function adj(kind) {
    return '<div class="adj"><button data-k="' + kind + '" data-d="-1" aria-label="Remove one ' + kind + ' today"' + (today[kind] === 0 ? " disabled" : "") + '>&minus;</button>' +
      '<div class="tdy">Today <b>' + today[kind] + '</b></div>' +
      '<button data-k="' + kind + '" data-d="1" aria-label="Add one ' + kind + ' today">+</button></div>';
  }
  function render() {
    document.getElementById("stats").innerHTML =
      '<div class="stat hero"><div class="n">' + sum("wins") + '</div><div class="l"><i class="dot" style="background:var(--s3)"></i>Wins this week</div>' + adj("wins") + '</div>' +
      '<div class="stat"><div class="n">' + daysWith("skool") + '</div><div class="l"><i class="dot" style="background:var(--s2)"></i>Skool days</div>' + adj("skool") + '</div>' +
      '<div class="stat"><div class="n">' + sum("commits") + '</div><div class="l"><i class="dot" style="background:var(--s1)"></i>Commits</div><div class="auto">Automatic from GitHub</div></div>';
  }
  document.getElementById("stats").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-k]") : null;
    if (!b || b.disabled) return;
    var k = b.dataset.k, d = Number(b.dataset.d);
    today[k] = Math.max(0, today[k] + d);
    paint(todayI); render(); save();
    if (d > 0) { cells[todayI].classList.add("pop"); setTimeout(function () { cells[todayI].classList.remove("pop"); }, 600); }
    document.getElementById("live").textContent = k + " today: " + today[k];
    var again = document.querySelector('#stats button[data-k="' + k + '"][data-d="' + d + '"]'); if (again) again.focus();
  });

  function save() { try { localStorage.setItem("amiw-demo2", JSON.stringify({ s: today.skool, w: today.wins })); } catch (e) {} }
  try {
    var sv = JSON.parse(localStorage.getItem("amiw-demo2") || "null");
    if (sv && typeof sv.s === "number" && typeof sv.w === "number") { today.skool = Math.max(0, sv.s); today.wins = Math.max(0, sv.w); paint(todayI); }
  } catch (e) {}

  var legend = document.getElementById("legend"), chart = document.getElementById("chart");
  function setView(v) {
    split = v === "split";
    chart.classList.toggle("split", split);
    document.getElementById("vBlend").setAttribute("aria-pressed", String(!split));
    document.getElementById("vSplit").setAttribute("aria-pressed", String(split));
    data.forEach(function (x, i) { paint(i); });
    legend.innerHTML = split
      ? '<span class="item"><i class="dot" style="background:var(--s1)"></i>Commits (top bar)</span><span class="item"><i class="dot" style="background:var(--s2)"></i>Skool (middle bar)</span><span class="item"><i class="dot" style="background:var(--s3)"></i>Wins (bottom bar)</span>'
      : '<span class="ramp">Less <i style="background:var(--surface-2)"></i><i style="background:var(--q1)"></i><i style="background:var(--q2)"></i><i style="background:var(--q3)"></i><i style="background:var(--q4)"></i> More</span><span>Outlined square is today.</span>';
  }
  document.getElementById("vBlend").onclick = function () { setView("blend"); };
  document.getElementById("vSplit").onclick = function () { setView("split"); };
  render(); setView("blend");
  var sc = document.getElementById("chartScroll"); sc.scrollLeft = sc.scrollWidth;
})();
</script>
</body>
</html>
