<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily record entry demo</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --tile: #eeeeeb; --border: #d6d5cf;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --green: #1a7f37; --red: #cf222e; --redbg: #ffebe9;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #0d1117; --tile: #1c2128; --border: #30363d;
    --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --green: #3fb950; --red: #f47067; --redbg: #3a1d20;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #0d1117; --tile: #1c2128; --border: #30363d;
  --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --green: #3fb950; --red: #f47067; --redbg: #3a1d20;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-1); color: var(--text-primary); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
.badge { display: inline-block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
h1 { font-size: 20px; margin: 10px 0 18px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }

.chart-scroll { overflow-x: auto; padding: 3px 4px 6px 0; }
.chart { min-width: 560px; }
.months { position: relative; height: 18px; margin-left: 34px; font-size: 12px; color: var(--text-muted); }
.months span { position: absolute; }
.body { display: flex; }
.wd { display: grid; grid-template-rows: repeat(7, 22px); gap: 3px; width: 34px; flex: none; font-size: 12px; color: var(--text-muted); }
.wd span { line-height: 22px; }
.grid { flex: 1; display: grid; grid-auto-flow: column; grid-template-columns: repeat(20, minmax(0, 1fr)); grid-template-rows: repeat(7, 22px); gap: 3px; }
.cell { border-radius: 4px; background: var(--tile); padding: 3px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; cursor: pointer; outline-offset: 2px; }
.cell:focus-visible { outline: 2px solid var(--text-primary); }
.cell.today { box-shadow: 0 0 0 2px var(--text-primary); }
.cell.sel { box-shadow: 0 0 0 2px var(--s3); }
.cell.today.sel { box-shadow: 0 0 0 2px var(--s3), 0 0 0 4px var(--text-primary); }
.lane { height: 4px; border-radius: 2px; }
.fill { height: 4px; border-radius: 2px; width: 0; }
.fill.a { background: var(--s1); } .fill.b { background: var(--s2); } .fill.c { background: var(--s3); }
.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat.clickable { cursor: pointer; }
.stat.hero { border-color: var(--s3); }
.stat.active { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.stat .info { min-width: 0; }
.stat .n { font-size: 22px; font-weight: 650; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.ctl { display: flex; align-items: center; gap: 6px; }
.td { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.td b { color: var(--text-primary); font-size: 14px; }
.mini { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font-size: 17px; line-height: 1; }
.mini:hover { background: var(--tile); }
.mini:disabled { opacity: .35; cursor: default; }

.feed { margin-top: 14px; }
.searchbar { display: flex; align-items: center; gap: 10px; background: var(--tile); border-radius: 10px; padding: 0 14px; height: 44px; color: var(--text-muted); }
.searchbar input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text-primary); font: inherit; font-size: 15px; height: 100%; }
.searchbar input:focus-visible { outline: none; }
.skoolctl { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); white-space: nowrap; padding-left: 10px; border-left: 1px solid var(--border); }
.skoolctl .td b { color: var(--text-primary); }
.skoolctl .mini { width: 26px; height: 26px; font-size: 15px; }
.searchbar:focus-within { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.count { font-size: 13px; white-space: nowrap; }
.banner { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--green); border-radius: 10px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.linkbtn { background: none; border: 0; color: var(--text-primary); text-decoration: underline; padding: 0; font-size: 13px; }

/* GitHub-style activity timeline, compact */
.tmonth { display: flex; align-items: center; gap: 12px; margin: 16px 0 4px; font-size: 14px; }
.tmonth b { font-weight: 600; } .tmonth span { color: var(--text-muted); }
.tmonth::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
.tg { position: relative; padding: 0 0 8px 18px; }
.tg::before { content: ""; position: absolute; left: 3px; top: 0; bottom: 0; border-left: 2px solid var(--border); }
.tg h3 { margin: 0; font-size: 14px; font-weight: 400; min-height: 26px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-radius: 6px; }
.tg h3 b { font-weight: 600; }
.tg h3.dz-day { outline: 2px dashed var(--green); outline-offset: 2px; }
.when { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 0; }
.rw + .rw { border-top: 1px solid var(--border); }
.tr .t { flex: 1; min-width: 140px; overflow-wrap: anywhere; font-size: 14px; }
.tr .m { font-size: 12px; color: var(--text-muted); }
.tr.dz-before { box-shadow: 0 -2px 0 var(--green); }
.tr.dz-after { box-shadow: 0 2px 0 var(--green); }
.tr.dz-club { background: var(--tile); outline: 2px dashed var(--green); outline-offset: 1px; border-radius: 6px; }
.tr.dragging { opacity: .4; }
.note2 { font-size: 12px; color: var(--green); }
.btns { display: flex; gap: 4px; align-items: center; }
.bt { font-size: 12px; padding: 2px 9px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); line-height: 1.5; }
.bt:hover:not(:disabled) { background: var(--tile); color: var(--text-primary); }
.bt:disabled { opacity: .3; cursor: default; }
.bt.ok { color: var(--green); border-color: var(--green); }
.bt.no { color: var(--red); border-color: var(--red); }
.bt.no.solid { background: var(--red); color: #fff; }
.bt.mv { padding: 2px 6px; display: inline-grid; place-items: center; cursor: grab; border-color: transparent; }
.bt.mv:active { cursor: grabbing; }
.confirm { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; background: var(--redbg); border: 1px solid var(--red); border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.menu { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 4px 0 6px; font-size: 12px; color: var(--text-secondary); }
.menu input[type="date"] { font: inherit; font-size: 12px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 6px; padding: 1px 4px; color-scheme: inherit; }
.kids { margin: 0 0 2px 4px; padding-left: 12px; border-left: 2px solid var(--green); }
.kids .rw + .rw { border-top: 1px solid var(--border); }
.detail { margin: 2px 0 6px; }
.tb { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-bottom: 4px; }
.tbb { font: inherit; font-size: 13px; min-width: 30px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); line-height: 1.5; }
.tbb:hover { background: var(--tile); color: var(--text-primary); }
.sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.ned { box-sizing: border-box; width: 100%; min-height: 80px; max-height: 1600px; overflow: auto; resize: vertical; font-size: 14px; line-height: 1.55; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.ned:focus-visible { outline: 2px solid var(--green); outline-offset: 1px; }
.ned:empty::before { content: attr(data-ph); color: var(--text-muted); }
.ned h3 { font-size: 15px; margin: 6px 0 2px; min-height: 0; display: block; }
.ned ul, .ned ol { margin: 4px 0; padding-left: 22px; }
.ned ul.todo { list-style: none; padding-left: 0; }
.ned ul.todo li { position: relative; padding-left: 26px; margin: 3px 0; }
.ned ul.todo li::before { content: ""; position: absolute; left: 2px; top: 4px; width: 15px; height: 15px; border: 1.5px solid var(--text-muted); border-radius: 4px; cursor: pointer; }
.ned ul.todo li[data-done]::before { background: var(--green); border-color: var(--green); }
.ned ul.todo li[data-done]::after { content: ""; position: absolute; left: 7px; top: 6px; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.ned ul.todo li[data-done] { color: var(--text-muted); text-decoration: line-through; }
.nt { font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; padding: 0 5px; margin-left: 4px; }
.qtyl { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; color: var(--text-secondary); }
.qtyin { width: 52px; font: inherit; font-size: 14px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--green); border-radius: 6px; padding: 3px 6px; }
.qb { color: var(--green); font-weight: 600; }
.editin { flex: 1; min-width: 160px; font: inherit; font-size: 14px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--green); border-radius: 6px; padding: 3px 8px; }
.empty { margin-top: 18px; color: var(--text-muted); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.35); display: none; gap: 14px; align-items: center; font-size: 14px; z-index: 20; }
.toast .bt { color: var(--text-primary); }
.tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25); min-width: 170px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.note { margin-top: 24px; color: var(--text-muted); font-size: 13px; }
@media (max-width: 560px) { .count { display: none; } .skoolctl .td { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Demo, made up history</span>
  <h1>Daily record</h1>

  <div class="chart-scroll" id="chartScroll">
    <div class="chart">
      <div class="months" id="months"></div>
      <div class="body">
        <div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="grid" id="grid" role="group" aria-label="Activity grid, 20 weeks. Press a day to see just that day."></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span class="item"><i class="dot" style="background:var(--s1)"></i>Commits (top bar)</span>
    <span class="item"><i class="dot" style="background:var(--s2)"></i>Skool (middle bar)</span>
    <span class="item"><i class="dot" style="background:var(--s3)"></i>Wins (bottom bar)</span>
    <span>Click a day to see just that day. Click it again to go back.</span>
  </div>

  <section class="feed" aria-label="Win log">
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search, or type a win and press Enter" aria-label="Search the log, or type a win and press Enter to add it">
      <span id="count" class="count"></span>
      <span class="skoolctl" id="stats"></span>
    </div>
    <div id="feedList"></div>
  </section>

  <p class="note">Demo only. Everything here stays in this browser. The real tracker saves it to a file on your server.</p>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button class="bt" id="toastUndo">Undo</button></div>
<div class="tip" id="tip"></div>

<script>
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(2611);
  var WEEKS = 20, DAYS = WEEKS * 7, todayI = DAYS - 1;
  var end = Date.UTC(2026, 10, 8), start = end - (DAYS - 1) * 864e5;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmt(d) { return WD[(d.getUTCDay() + 6) % 7] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function hhmm() { return new Date().toTimeString().slice(0, 5); }

  // made-up history
  var base = [];
  for (var i = 0; i < DAYS; i++) {
    var w = i % 7, vanish = (i > 78 && i < 83) || (i > 112 && i < 115), isT = i === todayI;
    base.push({ d: new Date(start + i * 864e5), c0: vanish ? 0 : Math.floor(rand() * (w > 4 ? 9 : 5)),
      s0: !isT && i > 118 ? (rand() < 0.7 ? 1 : 0) : 0, w0: !isT && i > 124 && !vanish ? (rand() < 0.3 ? 1 : 0) : 0 });
  }
  var SAMPLE = ["Sent my first 3 outreach messages", "Friend replied, wants to talk about his Excel work", "Prospect list reached 30 names", "Tested the message on 3 people", "Booked an intro call", "Finished the Skool niche lesson", "Posted my baseline in the community", "Shipped the tracker demo"];
  var nid = 1, entries = [], overrides = {}, skoolC = base.map(function (b) { return b.s0; });
  var sel = null, flt = "all", editing = null, openId = null, menuFor = null, clubFrom = null, confirmDel = null, undoSnap = null, toastT = null;
  function mk(day, text, time) { return { id: nid++, kind: "win", day: day, text: text, time: time, parent: null }; }
  (function seed() {
    var k = 0;
    base.forEach(function (x, i) {
      if (i >= todayI) return;
      for (var n = 0; n < x.w0; n++) entries.push(mk(i, SAMPLE[k++ % SAMPLE.length], ("0" + (9 + ((i * 7 + n * 3) % 11))).slice(-2) + ":" + ("0" + ((i * 13 + n * 17) % 60)).slice(-2)));
    });
    entries.reverse();
  })();

  var data = base.map(function (x) { return { d: x.d, commits: x.c0, skool: 0, wins: 0 }; });
  function qty(e) { var n = Math.floor(Number(e.n)); return n >= 1 ? Math.min(n, 99) : 1; }
  function recompute() {
    data.forEach(function (x, i) { x.commits = overrides[i] !== undefined ? overrides[i] : base[i].c0; x.skool = skoolC[i]; x.wins = 0; });
    entries.forEach(function (e) { data[e.day].wins += qty(e); });
    // bar scale follows the data: the biggest day of each row is always the full bar
    KEYS.forEach(function (k) { CAPS[k] = Math.max(FLOOR[k], data.reduce(function (m, x) { return Math.max(m, x[k]); }, 0)); });
  }
  function tgt() { return sel === null ? todayI : sel; }
  function byId(id) { for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i]; return null; }
  function kidsOf(id) { return entries.filter(function (e) { return e.parent === id; }); }
  function snap() { return JSON.stringify({ e: entries, o: overrides, n: nid, s: skoolC }); }
  function restore(s) { var o = JSON.parse(s); entries = o.e; overrides = o.o; nid = o.n; skoolC = o.s; afterChange(); }

  // grid
  var cells = [], grid = document.getElementById("grid"), tip = document.getElementById("tip");
  var KEYS = ["commits", "skool", "wins"], FLOOR = { commits: 1, skool: 1, wins: 1 }, CAPS = { commits: 1, skool: 1, wins: 1 }, CL = ["a", "b", "c"];
  function paint(i) {
    var x = data[i], c = cells[i], f = c.querySelectorAll(".fill");
    c.className = "cell" + (i === todayI ? " today" : "") + (i === sel ? " sel" : "");
    c.setAttribute("aria-label", fmt(x.d) + ": " + x.commits + " commits, " + x.skool + " Skool, " + x.wins + " wins" + (i === sel ? ", selected" : ""));
    c.setAttribute("aria-pressed", String(i === sel));
    for (var k = 0; k < 3; k++) { var v = x[KEYS[k]]; f[k].style.width = v ? Math.max(16, Math.min(100, v / CAPS[KEYS[k]] * 100)) + "%" : "0%"; }
  }
  base.forEach(function (b, i) {
    var c = document.createElement("div"); c.tabIndex = 0; c.setAttribute("role", "button");
    CL.forEach(function (cl) { var lane = document.createElement("div"); lane.className = "lane"; var f = document.createElement("div"); f.className = "fill " + cl; lane.appendChild(f); c.appendChild(lane); });
    function show() {
      var r = c.getBoundingClientRect(), x = data[i];
      tip.innerHTML = "<b>" + fmt(x.d) + (i === todayI ? " (today)" : "") + "</b>" +
        '<div><i class="dot" style="background:var(--s1)"></i>' + x.commits + " commits</div>" +
        '<div><i class="dot" style="background:var(--s2)"></i>' + x.skool + " Skool</div>" +
        '<div><i class="dot" style="background:var(--s3)"></i>' + x.wins + " wins</div>";
      tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = (r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + "px";
    }
    function hide() { tip.style.display = "none"; }
    c.addEventListener("pointerenter", show); c.addEventListener("pointerleave", hide);
    c.addEventListener("focus", show); c.addEventListener("blur", hide);
    function pick() { sel = sel === i ? null : i; clubFrom = null; confirmDel = null; editing = null; afterChange(); }
    c.addEventListener("click", pick);
    c.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    cells.push(c); grid.appendChild(c);
  });
  var months = document.getElementById("months"), lastM = -1;
  for (var wk = 0; wk < WEEKS; wk++) {
    var md = new Date(start + wk * 7 * 864e5);
    if (md.getUTCMonth() !== lastM) { var sp = document.createElement("span"); sp.textContent = MON[md.getUTCMonth()]; sp.style.left = (wk / WEEKS * 100) + "%"; months.appendChild(sp); lastM = md.getUTCMonth(); }
  }

  // stat boxes: only the Skool box changes numbers; the Commits box switches the list to commit days
  function sum(k) { return data.slice(-7).reduce(function (t, x) { return t + x[k]; }, 0); }
  function daysWith(k) { return data.slice(-7).filter(function (x) { return x[k] > 0; }).length; }
  function dayWord() { return sel === null ? "Today" : data[sel].d.getUTCDate() + " " + MON[data[sel].d.getUTCMonth()]; }
  function ctl(kind) {
    var v = data[tgt()][kind], w = esc(dayWord());
    if (kind !== "skool") return '<div class="td">' + w + ' <b>' + v + '</b></div>';
    return '<div class="ctl"><span class="td">' + w + ' <b>' + v + '</b></span>' +
      '<button class="mini" data-act="step" data-d="-1" aria-label="Remove one Skool on ' + w + '"' + (v === 0 ? " disabled" : "") + '>&minus;</button>' +
      '<button class="mini" data-act="step" data-d="1" aria-label="Add one Skool on ' + w + '">+</button></div>';
  }
  function box(f, cls, color, n, label, right, clickable) {
    var attrs = clickable ? ' data-filter="' + f + '" tabindex="0" role="button" aria-pressed="' + (flt === f) + '" aria-label="' + label + ', press to show commits per day"' : "";
    return '<div class="stat ' + cls + (clickable ? " clickable" : "") + (clickable && flt === f ? " active" : "") + '"' + attrs + '><div class="info"><div class="n">' + n + '</div><div class="l"><i class="dot" style="background:var(' + color + ')"></i>' + label + '</div></div>' + right + '</div>';
  }
  function renderStats() {
    var v = data[tgt()]["skool"], w = esc(dayWord());
