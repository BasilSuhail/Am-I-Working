<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily record entry demo</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --tile: #eeeeeb; --track: #e1e0db; --border: #d6d5cf;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --tile: #2a2a28; --track: #353532; --border: #3a3a37;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --tile: #2a2a28; --track: #353532; --border: #3a3a37;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-1); color: var(--text-primary); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 48px; }
.badge { display: inline-block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
h1 { font-size: 20px; margin: 10px 0 18px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.chart-scroll { overflow-x: auto; padding: 3px 4px 6px 0; }
.chart { min-width: 560px; }
.months { position: relative; height: 18px; margin-left: 34px; font-size: 12px; color: var(--text-muted); }
.months span { position: absolute; }
.body { display: flex; gap: 0; }
.wd { display: grid; grid-template-rows: repeat(7, 22px); gap: 3px; width: 34px; flex: none; font-size: 12px; color: var(--text-muted); }
.wd span { line-height: 22px; }
.grid { flex: 1; display: grid; grid-auto-flow: column; grid-template-columns: repeat(20, minmax(0, 1fr)); grid-template-rows: repeat(7, 22px); gap: 3px; }
.cell { border-radius: 4px; background: var(--tile); padding: 3px; display: flex; flex-direction: column; justify-content: space-between; outline-offset: 2px; min-width: 0; }
.cell:focus-visible { outline: 2px solid var(--text-primary); }
.cell.today { box-shadow: 0 0 0 2px var(--text-primary); }
.lane { height: 4px; background: transparent; border-radius: 2px; overflow: hidden; }
.fill { height: 4px; border-radius: 2px; width: 0; }
.fill.a { background: var(--s1); } .fill.b { background: var(--s2); } .fill.c { background: var(--s3); }
.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 14px; font-size: 13px; color: var(--text-secondary); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat .info { min-width: 0; }
.ctl { display: flex; align-items: center; gap: 6px; }
.td { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.td b { color: var(--text-primary); font-size: 14px; }
.ctl button { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font: inherit; font-size: 17px; line-height: 1; cursor: pointer; }
.ctl button:hover { background: var(--tile); }
.ctl button:disabled { opacity: .35; cursor: default; }
.ctl button:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.stat.hero { border-color: var(--s3); }
.stat .n { font-size: 22px; font-weight: 650; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.adj { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
.adj .tdy { flex: 1; text-align: center; font-size: 13px; color: var(--text-secondary); }
.adj .tdy b { color: var(--text-primary); font-size: 16px; }
.adj button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font: inherit; font-size: 20px; line-height: 1; cursor: pointer; }
.adj button:hover { background: var(--tile); }
.adj button:disabled { opacity: .35; cursor: default; }
.adj button:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.adj input { flex: 1; min-width: 0; height: 34px; font: inherit; font-size: 14px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 0 10px; }
.adj input:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.lastwin { margin-top: 8px; font-size: 13px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lastwin b { color: var(--text-primary); }
.feed { margin-top: 14px; }
.searchbar { display: flex; align-items: center; gap: 10px; background: var(--tile); border-radius: 10px; padding: 0 14px; height: 44px; color: var(--text-muted); }
.searchbar input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text-primary); font: inherit; font-size: 15px; height: 100%; }
.searchbar input:focus-visible { outline: none; }
.searchbar:focus-within { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.count { font-size: 13px; white-space: nowrap; }
.mon { margin: 20px 0 4px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.card { display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 8px; background: var(--tile); }
.dcol { min-width: 44px; text-align: center; line-height: 1.15; }
.dcol b { display: block; font-size: 20px; }
.dcol span { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.card .main { flex: 1; min-width: 0; }
.card .txt { font-size: 15px; overflow-wrap: anywhere; }
.card .meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.empty { margin-top: 14px; color: var(--text-muted); font-size: 14px; }
.auto { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted); text-align: center; line-height: 34px; }
.tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); min-width: 170px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.note { margin-top: 20px; color: var(--text-muted); font-size: 13px; }
@media (max-width: 560px) { .stats { grid-template-columns: 1fr; } .count { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Demo, made up history</span>
  <h1>Daily record</h1>

  <div class="chart-scroll" id="chartScroll">
    <div class="chart">
      <div class="months" id="months"></div>
      <div class="body">
        <div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="grid" id="grid" role="img" aria-label="Activity grid, 20 weeks. Each day has three bars: commits, Skool, wins."></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span class="item"><i class="dot" style="background:var(--s1)"></i>Commits (top bar)</span>
    <span class="item"><i class="dot" style="background:var(--s2)"></i>Skool (middle bar)</span>
    <span class="item"><i class="dot" style="background:var(--s3)"></i>Wins (bottom bar)</span>
    <span>Longer bar means more. Outlined tile is today.</span>
  </div>

  <div class="stats" id="stats"></div>
  <div class="sr" id="live" role="status" aria-live="polite"></div>

  <section class="feed" aria-label="Win log">
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search wins, or type a win and press Enter" aria-label="Search wins, or type a win and press Enter to add it">
      <span id="count" class="count"></span>
    </div>
    <div id="feedList"></div>
  </section>

  <p class="note">Demo only. Counts you change here stay in this browser. The real tracker saves them to a file on your server.</p>
</div>
<div class="tip" id="tip"></div>

<script>
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(2611);
  var WEEKS = 20, DAYS = WEEKS * 7;
  var end = Date.UTC(2026, 10, 8), start = end - (DAYS - 1) * 864e5;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var data = [];
  for (var i = 0; i < DAYS; i++) {
    var w = i % 7, vanish = (i > 78 && i < 83) || (i > 112 && i < 115), isToday = i === DAYS - 1;
    data.push({ d: new Date(start + i * 864e5),
      commits: vanish ? 0 : Math.floor(rand() * (w > 4 ? 9 : 5)),
      skool: !isToday && i > 118 ? (rand() < 0.7 ? 1 : 0) : 0,
      wins: !isToday && i > 124 && !vanish ? (rand() < 0.3 ? 1 : 0) : 0 });
  }
  var todayI = DAYS - 1, today = data[todayI];
  var caps = { commits: 8, skool: 2, wins: 2 };
  function fmt(d) { return WD[(d.getUTCDay() + 6) % 7] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }

  var cells = [], grid = document.getElementById("grid"), tip = document.getElementById("tip");
  var KEYS = ["commits", "skool", "wins"], CL = ["a", "b", "c"];
  function paint(i) {
    var x = data[i], c = cells[i], fills = c.querySelectorAll(".fill");
    c.className = "cell" + (i === todayI ? " today" : "");
    c.setAttribute("aria-label", fmt(x.d) + ": " + x.commits + " commits, " + x.skool + " Skool, " + x.wins + " wins");
    for (var k = 0; k < 3; k++) {
      var v = x[KEYS[k]];
      fills[k].style.width = v ? Math.max(28, Math.min(100, v / caps[KEYS[k]] * 100)) + "%" : "0%";
    }
  }
  data.forEach(function (x, i) {
    var c = document.createElement("div"); c.tabIndex = 0;
    CL.forEach(function (cl) {
      var lane = document.createElement("div"); lane.className = "lane";
      var f = document.createElement("div"); f.className = "fill " + cl; lane.appendChild(f); c.appendChild(lane);
    });
    function show() {
      var r = c.getBoundingClientRect();
      tip.innerHTML = "<b>" + fmt(x.d) + (i === todayI ? " (today)" : "") + "</b>" +
        '<div><i class="dot" style="background:var(--s1)"></i>' + x.commits + " commits</div>" +
        '<div><i class="dot" style="background:var(--s2)"></i>' + x.skool + " Skool</div>" +
        '<div><i class="dot" style="background:var(--s3)"></i>' + x.wins + " wins</div>";
      tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = (r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + "px";
    }
    function hide() { tip.style.display = "none"; }
    c.addEventListener("pointerenter", show); c.addEventListener("pointerleave", hide);
    c.addEventListener("focus", show); c.addEventListener("blur", hide);
    cells.push(c); grid.appendChild(c); paint(i);
  });

  var months = document.getElementById("months"), lastM = -1;
  for (var wk = 0; wk < WEEKS; wk++) {
    var md = new Date(start + wk * 7 * 864e5);
    if (md.getUTCMonth() !== lastM) { var s = document.createElement("span"); s.textContent = MON[md.getUTCMonth()]; s.style.left = (wk / WEEKS * 100) + "%"; months.appendChild(s); lastM = md.getUTCMonth(); }
  }

  function sum(k) { return data.slice(-7).reduce(function (t, x) { return t + x[k]; }, 0); }
  function daysWith(k) { return data.slice(-7).filter(function (x) { return x[k] > 0; }).length; }
  var winNotes = [], draft = "";
  function hhmm() { return new Date().toTimeString().slice(0, 5); }
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function ctl(kind, canAdd) {
    return '<div class="ctl"><span class="td">Today <b>' + today[kind] + '</b></span>' +
      '<button data-k="' + kind + '" data-d="-1" aria-label="Remove one ' + kind + ' today"' + (today[kind] === 0 ? " disabled" : "") + '>&minus;</button>' +
      (canAdd ? '<button data-k="' + kind + '" data-d="1" aria-label="Add one ' + kind + ' today">+</button>' : "") + '</div>';
  }
  function render() {
    document.getElementById("stats").innerHTML =
      '<div class="stat hero"><div class="info"><div class="n">' + sum("wins") + '</div><div class="l"><i class="dot" style="background:var(--s3)"></i>Wins this week</div></div>' + ctl("wins", false) + '</div>' +
      '<div class="stat"><div class="info"><div class="n">' + daysWith("skool") + '</div><div class="l"><i class="dot" style="background:var(--s2)"></i>Skool days</div></div>' + ctl("skool", true) + '</div>' +
      '<div class="stat"><div class="info"><div class="n">' + sum("commits") + '</div><div class="l"><i class="dot" style="background:var(--s1)"></i>Commits</div></div><div class="td">from GitHub</div></div>';
  }
  function popToday() { cells[todayI].classList.add("pop"); setTimeout(function () { cells[todayI].classList.remove("pop"); }, 600); }
  var statsEl = document.getElementById("stats"), live = document.getElementById("live");
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    var t = this.value.trim();
    if (!t) return;
    winNotes.push({ t: t.slice(0, 140), time: hhmm() }); today.wins = winNotes.length; this.value = "";
    paint(todayI); render(); renderFeed(); save(); popToday();
    live.textContent = "Win logged. Today: " + today.wins;
  });
  statsEl.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-k]") : null;
    if (!b || b.disabled) return;
    var k = b.dataset.k, d = Number(b.dataset.d);
    if (k === "wins") { if (d < 0 && winNotes.length) { winNotes.pop(); today.wins = winNotes.length; } }
    else today[k] = Math.max(0, today[k] + d);
    paint(todayI); render(); renderFeed(); save();
    if (d > 0) popToday();
    live.textContent = k + " today: " + today[k];
    var again = document.querySelector('#stats button[data-k="' + k + '"][data-d="' + d + '"]'); if (again) again.focus();
  });

  var FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var SAMPLE = ["Sent my first 3 outreach messages", "Friend replied, wants to talk about his Excel work", "Prospect list reached 30 names", "Tested the message on 3 people", "Booked an intro call", "Finished the Skool niche lesson", "Posted my baseline in the community", "Shipped the tracker demo"];
  var pastWins = [];
  data.forEach(function (x, i) {
    if (i >= todayI) return;
    for (var n = 0; n < x.wins; n++) pastWins.push({ d: x.d, t: SAMPLE[pastWins.length % SAMPLE.length], time: ("0" + (9 + ((i * 7 + n * 3) % 11))).slice(-2) + ":" + ("0" + ((i * 13 + n * 17) % 60)).slice(-2) });
  });
  function renderFeed() {
    var q = (document.getElementById("q").value || "").trim().toLowerCase();
    var all = pastWins.concat(winNotes.map(function (n) { return { d: today.d, t: n.t, time: n.time }; })).reverse();
    var shown = all.filter(function (e) { return !q || (fmt(e.d) + " " + FULL[e.d.getUTCMonth()] + " " + e.t).toLowerCase().indexOf(q) !== -1; });
    document.getElementById("count").textContent = q ? shown.length + " of " + all.length + " wins \u00b7 Enter adds it as a win" : all.length + " wins";
    var html = "", lastKey = "";
    shown.forEach(function (e) {
      var key = e.d.getUTCFullYear() + "-" + e.d.getUTCMonth();
      if (key !== lastKey) { html += '<div class="mon">' + FULL[e.d.getUTCMonth()] + " " + e.d.getUTCFullYear() + "</div>"; lastKey = key; }
      html += '<article class="card"><div class="dcol"><b>' + e.d.getUTCDate() + "</b><span>" + MON[e.d.getUTCMonth()] + '</span></div>' +
        '<div class="main"><div class="txt">' + esc(e.t) + '</div><div class="meta">' + fmt(e.d) + (e.time ? " &middot; " + e.time : "") + '</div></div>' +
        '<span class="chip"><i class="dot" style="background:var(--s3)"></i>Win</span></article>';
    });
    document.getElementById("feedList").innerHTML = html || '<p class="empty">No match. Press Enter to add it as a win.</p>';
  }
  document.getElementById("q").addEventListener("input", renderFeed);

  function save() { try { localStorage.setItem("amiw-demo4", JSON.stringify({ s: today.skool, notes: winNotes })); } catch (e) {} }
  try {
    var sv = JSON.parse(localStorage.getItem("amiw-demo4") || "null");
    if (sv && typeof sv.s === "number" && Array.isArray(sv.notes)) {
      today.skool = Math.max(0, sv.s);
      winNotes = sv.notes.map(function (n) { return typeof n === "string" ? { t: n, time: "" } : n; }).filter(function (n) { return n && typeof n.t === "string"; }).slice(0, 50);
      today.wins = winNotes.length; paint(todayI);
    }
  } catch (e) {}

  render(); renderFeed();
  var sc = document.getElementById("chartScroll"); sc.scrollLeft = sc.scrollWidth;
})();
</script>
</body>
</html>
