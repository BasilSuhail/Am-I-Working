<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily record entry demo</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --tile: #eeeeeb; --border: #d6d5cf;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #1a1a19; --tile: #2a2a28; --border: #3a3a37;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --tile: #2a2a28; --border: #3a3a37;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-1); color: var(--text-primary); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
.badge { display: inline-block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
h1 { font-size: 20px; margin: 10px 0 18px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
button { font: inherit; cursor: pointer; }

.chart-scroll { overflow-x: auto; padding: 3px 4px 6px 0; }
.chart { min-width: 560px; }
.months { position: relative; height: 18px; margin-left: 34px; font-size: 12px; color: var(--text-muted); }
.months span { position: absolute; }
.body { display: flex; }
.wd { display: grid; grid-template-rows: repeat(7, 22px); gap: 3px; width: 34px; flex: none; font-size: 12px; color: var(--text-muted); }
.wd span { line-height: 22px; }
.grid { flex: 1; display: grid; grid-auto-flow: column; grid-template-columns: repeat(20, minmax(0, 1fr)); grid-template-rows: repeat(7, 22px); gap: 3px; }
.cell { border-radius: 4px; background: var(--tile); padding: 3px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; cursor: pointer; outline-offset: 2px; }
.cell:focus-visible { outline: 2px solid var(--text-primary); }
.cell.today { box-shadow: 0 0 0 2px var(--text-primary); }
.cell.sel { box-shadow: 0 0 0 2px var(--s3); }
.cell.today.sel { box-shadow: 0 0 0 2px var(--s3), 0 0 0 4px var(--text-primary); }
.lane { height: 4px; border-radius: 2px; }
.fill { height: 4px; border-radius: 2px; width: 0; }
.fill.a { background: var(--s1); } .fill.b { background: var(--s2); } .fill.c { background: var(--s3); }
.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; }
.stat.hero { border-color: var(--s3); }
.stat.active { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.stat .info { min-width: 0; }
.stat .n { font-size: 22px; font-weight: 650; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.ctl { display: flex; align-items: center; gap: 6px; }
.td { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.td b { color: var(--text-primary); font-size: 14px; }
.ctl button, .mini { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font-size: 17px; line-height: 1; }
.ctl button:hover, .mini:hover { background: var(--tile); }
.ctl button:disabled, .mini:disabled { opacity: .35; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }

.feed { margin-top: 14px; }
.searchbar { display: flex; align-items: center; gap: 10px; background: var(--tile); border-radius: 10px; padding: 0 14px; height: 44px; color: var(--text-muted); }
.searchbar input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text-primary); font: inherit; font-size: 15px; height: 100%; }
.searchbar input:focus-visible { outline: none; }
.searchbar:focus-within { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.count { font-size: 13px; white-space: nowrap; }
.status { margin-top: 8px; font-size: 13px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.linkbtn { background: none; border: 0; color: var(--text-primary); text-decoration: underline; padding: 0; font-size: 13px; }
.banner { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--s3); border-radius: 10px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.daypanel { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--s3); border-radius: 10px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 14px; }
.daypanel .grow { flex: 1; }
.mon { margin: 18px 0 4px; font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.card { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 8px; background: var(--tile); }
.card.sel { outline: 2px solid var(--s3); outline-offset: 1px; }
.card.pickable { cursor: pointer; border-style: dashed; border-color: var(--s3); }
.card.source { opacity: .5; }
.dcol { min-width: 44px; text-align: center; line-height: 1.15; }
.dcol b { display: block; font-size: 20px; }
.dcol span { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
.main { flex: 1; min-width: 160px; }
.txt { font-size: 15px; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; white-space: nowrap; }
.acts { display: flex; gap: 4px; flex-wrap: wrap; }
.acts button { font-size: 12px; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); }
.acts button:hover { background: var(--surface-1); color: var(--text-primary); }
.acts button:disabled { opacity: .3; cursor: default; }
.kids { margin: 8px 0 0; padding-left: 10px; border-left: 2px solid var(--s3); display: grid; gap: 6px; }
.kid { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 14px; }
.kid .k { flex: 1; min-width: 120px; overflow-wrap: anywhere; }
.kid .meta { margin: 0; }
.editin { width: 100%; font: inherit; font-size: 15px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; }
.empty { margin-top: 14px; color: var(--text-muted); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.25); display: none; gap: 12px; align-items: center; font-size: 14px; z-index: 20; }
.tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); min-width: 170px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.note { margin-top: 24px; color: var(--text-muted); font-size: 13px; }
@media (max-width: 560px) { .stats { grid-template-columns: 1fr; } .count { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Demo, made up history</span>
  <h1>Daily record</h1>

  <div class="chart-scroll" id="chartScroll">
    <div class="chart">
      <div class="months" id="months"></div>
      <div class="body">
        <div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="grid" id="grid" role="group" aria-label="Activity grid, 20 weeks. Press a day to select it."></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span class="item"><i class="dot" style="background:var(--s1)"></i>Commits (top bar)</span>
    <span class="item"><i class="dot" style="background:var(--s2)"></i>Skool (middle bar)</span>
    <span class="item"><i class="dot" style="background:var(--s3)"></i>Wins (bottom bar)</span>
    <span>Click a day to select it. Click a box to filter the list.</span>
  </div>

  <div class="stats" id="stats"></div>

  <section class="feed" aria-label="Log">
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search, or type a win and press Enter" aria-label="Search the log, or type a win and press Enter to add it">
      <span id="count" class="count"></span>
    </div>
    <div class="status" id="status"></div>
    <div id="feedList"></div>
  </section>

  <p class="note">Demo only. Everything here stays in this browser. The real tracker saves it to a file on your server.</p>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button class="linkbtn" id="toastUndo">Undo</button></div>
<div class="tip" id="tip"></div>

<script>
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(2611);
  var WEEKS = 20, DAYS = WEEKS * 7, todayI = DAYS - 1;
  var end = Date.UTC(2026, 10, 8), start = end - (DAYS - 1) * 864e5;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmt(d) { return WD[(d.getUTCDay() + 6) % 7] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function hhmm() { return new Date().toTimeString().slice(0, 5); }

  // sample history (made up)
  var base = [];
  for (var i = 0; i < DAYS; i++) {
    var w = i % 7, vanish = (i > 78 && i < 83) || (i > 112 && i < 115), isT = i === todayI;
    base.push({ d: new Date(start + i * 864e5), c0: vanish ? 0 : Math.floor(rand() * (w > 4 ? 9 : 5)),
      s0: !isT && i > 118 ? (rand() < 0.7 ? 1 : 0) : 0, w0: !isT && i > 124 && !vanish ? (rand() < 0.3 ? 1 : 0) : 0 });
  }
  var SAMPLE = ["Sent my first 3 outreach messages", "Friend replied, wants to talk about his Excel work", "Prospect list reached 30 names", "Tested the message on 3 people", "Booked an intro call", "Finished the Skool niche lesson", "Posted my baseline in the community", "Shipped the tracker demo"];
  var nid = 1, entries = [], overrides = {}, sel = null, flt = "all", editing = null, clubFrom = null, undoSnap = null, toastT = null;
  function mk(kind, day, text, time) { return { id: nid++, kind: kind, day: day, text: text, time: time, parent: null }; }
  (function seed() {
    var k = 0;
    base.forEach(function (x, i) {
      if (i >= todayI) return;
      for (var n = 0; n < x.w0; n++) entries.push(mk("win", i, SAMPLE[k++ % SAMPLE.length], ("0" + (9 + ((i * 7 + n * 3) % 11))).slice(-2) + ":" + ("0" + ((i * 13 + n * 17) % 60)).slice(-2)));
      for (var m = 0; m < x.s0; m++) entries.push(mk("skool", i, "Skool session", ("0" + (18 + ((i * 5) % 5))).slice(-2) + ":" + ("0" + ((i * 11) % 60)).slice(-2)));
    });
    entries.reverse();
  })();

  var data = base.map(function (x) { return { d: x.d, commits: x.c0, skool: 0, wins: 0 }; });
  function recompute() {
    data.forEach(function (x, i) { x.commits = overrides[i] !== undefined ? overrides[i] : base[i].c0; x.skool = 0; x.wins = 0; });
    entries.forEach(function (e) { data[e.day][e.kind === "win" ? "wins" : "skool"]++; });
  }
  function tgt() { return sel === null ? todayI : sel; }
  function byId(id) { for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i]; return null; }
  function snap() { return JSON.stringify({ e: entries, o: overrides, n: nid }); }
  function restore(s) { var o = JSON.parse(s); entries = o.e; overrides = o.o; nid = o.n; afterChange(); }

  // grid
  var cells = [], grid = document.getElementById("grid"), tip = document.getElementById("tip");
  var KEYS = ["commits", "skool", "wins"], CAPS = { commits: 8, skool: 2, wins: 2 }, CL = ["a", "b", "c"];
  function paint(i) {
    var x = data[i], c = cells[i], f = c.querySelectorAll(".fill");
    c.className = "cell" + (i === todayI ? " today" : "") + (i === sel ? " sel" : "");
    c.setAttribute("aria-label", fmt(x.d) + ": " + x.commits + " commits, " + x.skool + " Skool, " + x.wins + " wins" + (i === sel ? ", selected" : ""));
    c.setAttribute("aria-pressed", String(i === sel));
    for (var k = 0; k < 3; k++) { var v = x[KEYS[k]]; f[k].style.width = v ? Math.max(28, Math.min(100, v / CAPS[KEYS[k]] * 100)) + "%" : "0%"; }
  }
  base.forEach(function (b, i) {
    var c = document.createElement("div"); c.tabIndex = 0; c.setAttribute("role", "button");
    CL.forEach(function (cl) { var lane = document.createElement("div"); lane.className = "lane"; var f = document.createElement("div"); f.className = "fill " + cl; lane.appendChild(f); c.appendChild(lane); });
    function show() {
      var r = c.getBoundingClientRect(), x = data[i];
      tip.innerHTML = "<b>" + fmt(x.d) + (i === todayI ? " (today)" : "") + "</b>" +
        '<div><i class="dot" style="background:var(--s1)"></i>' + x.commits + " commits</div>" +
        '<div><i class="dot" style="background:var(--s2)"></i>' + x.skool + " Skool</div>" +
        '<div><i class="dot" style="background:var(--s3)"></i>' + x.wins + " wins</div>";
      tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = (r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + "px";
    }
    function hide() { tip.style.display = "none"; }
    c.addEventListener("pointerenter", show); c.addEventListener("pointerleave", hide);
    c.addEventListener("focus", show); c.addEventListener("blur", hide);
    function pick() { sel = sel === i ? null : i; clubFrom = null; afterChange(); if (sel !== null) { var h = document.querySelector(".card.sel"); if (h && h.scrollIntoView) h.scrollIntoView({ block: "nearest", behavior: "smooth" }); } }
    c.addEventListener("click", pick);
    c.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    cells.push(c); grid.appendChild(c);
  });
  var months = document.getElementById("months"), lastM = -1;
  for (var wk = 0; wk < WEEKS; wk++) {
    var md = new Date(start + wk * 7 * 864e5);
    if (md.getUTCMonth() !== lastM) { var sp = document.createElement("span"); sp.textContent = MON[md.getUTCMonth()]; sp.style.left = (wk / WEEKS * 100) + "%"; months.appendChild(sp); lastM = md.getUTCMonth(); }
  }

  // stat boxes
  function sum(k) { return data.slice(-7).reduce(function (t, x) { return t + x[k]; }, 0); }
  function daysWith(k) { return data.slice(-7).filter(function (x) { return x[k] > 0; }).length; }
  function dayWord() { return sel === null ? "Today" : data[sel].d.getUTCDate() + " " + MON[data[sel].d.getUTCMonth()]; }
  function ctl(kind, canAdd) {
    var v = data[tgt()][kind];
    return '<div class="ctl"><span class="td">' + esc(dayWord()) + ' <b>' + v + '</b></span>' +
      '<button data-act="step" data-k="' + kind + '" data-d="-1" aria-label="Remove one ' + kind + ' on ' + esc(dayWord()) + '"' + (v === 0 ? " disabled" : "") + '>&minus;</button>' +
      (canAdd ? '<button data-act="step" data-k="' + kind + '" data-d="1" aria-label="Add one ' + kind + ' on ' + esc(dayWord()) + '">+</button>' : "") + '</div>';
  }
  function box(f, cls, color, n, label, right) {
    return '<div class="stat ' + cls + (flt === f ? " active" : "") + '" data-filter="' + f + '" tabindex="0" role="button" aria-pressed="' + (flt === f) + '" aria-label="' + label + ', press to filter the list"><div class="info"><div class="n">' + n + '</div><div class="l"><i class="dot" style="background:var(' + color + ')"></i>' + label + '</div></div>' + right + '</div>';
  }
  function renderStats() {
    document.getElementById("stats").innerHTML =
      box("wins", "hero", "--s3", sum("wins"), "Wins this week", ctl("wins", false)) +
      box("skool", "", "--s2", daysWith("skool"), "Skool days", ctl("skool", true)) +
      box("commits", "", "--s1", sum("commits"), "Commits", '<div class="td">from GitHub</div>');
  }

  // feed
  function kidsOf(id) { return entries.filter(function (e) { return e.parent === id; }); }
  function matches(e, q) { return !q || (fmt(base[e.day].d) + " " + FULL[base[e.day].d.getUTCMonth()] + " " + e.text + " " + e.kind).toLowerCase().indexOf(q) !== -1; }
  function acts(e, idx, n) {
    return '<div class="acts"><button data-act="up" data-id="' + e.id + '"' + (idx === 0 ? " disabled" : "") + ' aria-label="Move up">&uarr;</button>' +
      '<button data-act="down" data-id="' + e.id + '"' + (idx === n - 1 ? " disabled" : "") + ' aria-label="Move down">&darr;</button>' +
      '<button data-act="edit" data-id="' + e.id + '">Edit</button>' +
      (e.kind === "win" ? '<button data-act="club" data-id="' + e.id + '">Club</button>' : "") +
      '<button data-act="del" data-id="' + e.id + '">Remove</button></div>';
  }
  function textHtml(e) {
    return editing === e.id ? '<input class="editin" data-edit="' + e.id + '" value="' + esc(e.text) + '" maxlength="140" aria-label="Edit text, Enter to save, Escape to cancel">' : esc(e.text);
  }
  function commitRow(i) {
    var x = data[i], o = overrides[i] !== undefined;
    return '<article class="card' + (i === sel ? " sel" : "") + '"><div class="dcol"><b>' + x.d.getUTCDate() + '</b><span>' + MON[x.d.getUTCMonth()] + '</span></div>' +
      '<div class="main"><div class="txt">' + x.commits + ' commits counted</div><div class="meta">' + fmt(x.d) + ' &middot; GitHub says ' + base[i].c0 + (o ? ' &middot; edited' : '') + '</div></div>' +
      '<span class="chip"><i class="dot" style="background:var(--s1)"></i>Commits</span>' +
      '<div class="ctl"><button class="mini" data-act="cstep" data-i="' + i + '" data-d="-1" aria-label="Count one fewer commit on ' + fmt(x.d) + '"' + (x.commits === 0 ? " disabled" : "") + '>&minus;</button>' +
      '<button class="mini" data-act="cstep" data-i="' + i + '" data-d="1" aria-label="Count one more commit on ' + fmt(x.d) + '">+</button>' +
      (o ? '<button class="linkbtn" data-act="creset" data-i="' + i + '">Reset</button>' : "") + '</div></article>';
  }
  function renderFeed() {
    var q = (document.getElementById("q").value || "").trim().toLowerCase(), html = "", total, shown;
    // status line
    var st = [];
    if (flt !== "all") st.push('Showing ' + flt + ' <button class="linkbtn" data-act="clearflt">Show everything</button>');
    if (sel !== null) st.push('Adding to <b>' + esc(fmt(base[sel].d)) + '</b> <button class="linkbtn" data-act="today">Back to today</button>');
    document.getElementById("status").innerHTML = st.join(" &middot; ");
    if (clubFrom !== null) html += '<div class="banner"><span>Pick the win to club <b>' + esc(byId(clubFrom).text) + '</b> into. It still counts as its own win.</span><button class="linkbtn" data-act="cancelclub">Cancel</button></div>';
    if (sel !== null) {
      var x = data[sel], o = overrides[sel] !== undefined;
      html += '<div class="daypanel"><b>' + esc(fmt(x.d)) + '</b><span class="grow">' + x.wins + (x.wins === 1 ? ' win' : ' wins') + ' &middot; ' + x.skool + ' Skool</span><span class="ctl"><span class="td">Commits <b>' + x.commits + '</b>' + (o ? ' (GitHub ' + base[sel].c0 + ')' : '') + '</span>' +
        '<button class="mini" data-act="cstep" data-i="' + sel + '" data-d="-1" aria-label="Count one fewer commit"' + (x.commits === 0 ? " disabled" : "") + '>&minus;</button><button class="mini" data-act="cstep" data-i="' + sel + '" data-d="1" aria-label="Count one more commit">+</button>' +
        (o ? '<button class="linkbtn" data-act="creset" data-i="' + sel + '">Reset</button>' : "") + '</span></div>';
    }
    if (flt === "commits") {
      var days = []; for (var i = DAYS - 1; i >= 0; i--) if ((base[i].c0 > 0 || overrides[i] !== undefined) && (!q || (fmt(base[i].d) + " " + FULL[base[i].d.getUTCMonth()] + " commits").toLowerCase().indexOf(q) !== -1)) days.push(i);
      total = days.length; var lim = days.slice(0, 40);
      lim.forEach(function (i) { html += commitRow(i); });
      if (!lim.length) html += '<p class="empty">No days match.</p>';
      if (days.length > 40) html += '<p class="empty">Showing the latest 40 days. Search to find older ones.</p>';
      document.getElementById("count").textContent = total + " days";
    } else {
      var top = entries.filter(function (e) { return !e.parent && (flt === "all" || (flt === "wins" && e.kind === "win") || (flt === "skool" && e.kind === "skool")); });
      var vis = top.filter(function (e) { return matches(e, q) || kidsOf(e.id).some(function (k) { return matches(k, q); }); });
      var all = entries.filter(function (e) { return flt === "all" || (flt === "wins" && e.kind === "win") || (flt === "skool" && e.kind === "skool"); });
      document.getElementById("count").textContent = q ? vis.length + " of " + top.length + " entries · Enter adds a win" : all.length + " entries";
      var lastKey = "";
      vis.forEach(function (e, idx) {
        var d = base[e.day].d, key = d.getUTCFullYear() + "-" + d.getUTCMonth(), kids = kidsOf(e.id);
        if (key !== lastKey) { html += '<div class="mon">' + FULL[d.getUTCMonth()] + " " + d.getUTCFullYear() + "</div>"; lastKey = key; }
        var pick = clubFrom !== null && clubFrom !== e.id && e.kind === "win";
        html += '<article class="card' + (e.day === sel ? " sel" : "") + (pick ? " pickable" : "") + (clubFrom === e.id ? " source" : "") + '" data-id="' + e.id + '"' + (pick ? ' data-act="clubto" tabindex="0" role="button"' : "") + '>' +
          '<div class="dcol"><b>' + d.getUTCDate() + '</b><span>' + MON[d.getUTCMonth()] + '</span></div>' +
          '<div class="main"><div class="txt">' + textHtml(e) + '</div><div class="meta">' + fmt(d) + (e.time ? " &middot; " + e.time : "") + (kids.length ? " &middot; clubbed, counts as " + (kids.length + 1) + " wins" : "") + '</div>' +
          (kids.length ? '<div class="kids">' + kids.map(function (k) {
            return '<div class="kid"><span class="k">' + textHtml(k) + '</span><span class="meta">' + fmt(base[k.day].d) + '</span><span class="acts"><button data-act="edit" data-id="' + k.id + '">Edit</button><button data-act="unclub" data-id="' + k.id + '">Unclub</button><button data-act="del" data-id="' + k.id + '">Remove</button></span></div>';
          }).join("") + '</div>' : "") + '</div>' +
          '<span class="chip"><i class="dot" style="background:var(' + (e.kind === "win" ? "--s3" : "--s2") + ')"></i>' + (e.kind === "win" ? (kids.length ? (kids.length + 1) + " wins" : "Win") : "Skool") + '</span>' +
          (clubFrom === null ? acts(e, idx, vis.length) : "") + '</article>';
      });
      if (!vis.length) html += '<p class="empty">' + (q ? "No match. Press Enter to add it as a win." : "Nothing here yet.") + "</p>";
    }
    document.getElementById("feedList").innerHTML = html;
    var ed = document.querySelector(".editin"); if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
  }

  var live = document.getElementById("live"), toast = document.getElementById("toast");
  function save() { try { localStorage.setItem("amiw-demo5", snap()); } catch (e) {} }
  function afterChange() { recompute(); for (var i = 0; i < DAYS; i++) paint(i); renderStats(); renderFeed(); save(); }
  function popDay(i) { cells[i].classList.add("pop"); setTimeout(function () { cells[i].classList.remove("pop"); }, 600); }
  function showToast(msg, before) {
    undoSnap = before; document.getElementById("toastMsg").textContent = msg; toast.style.display = "flex";
    clearTimeout(toastT); toastT = setTimeout(function () { toast.style.display = "none"; undoSnap = null; }, 7000);
  }
  document.getElementById("toastUndo").onclick = function () { if (undoSnap) { restore(undoSnap); undoSnap = null; } toast.style.display = "none"; };
  function addEntry(kind, text) {
    var day = tgt(), e = mk(kind, day, text, hhmm()), at = entries.findIndex(function (x) { return !x.parent && x.day <= day; });
    if (at < 0) entries.push(e); else entries.splice(at, 0, e);
    afterChange(); popDay(day); live.textContent = (kind === "win" ? "Win" : "Skool") + " added to " + fmt(base[day].d);
  }
  function removeEntry(id) {
    var e = byId(id); if (!e) return; var before = snap();
    kidsOf(id).forEach(function (k) { k.parent = null; });
    entries = entries.filter(function (x) { return x.id !== id; });
    afterChange(); showToast("Removed: " + e.text.slice(0, 40), before);
  }
  function swap(id, dir) {
    var q = (document.getElementById("q").value || "").trim().toLowerCase();
    var vis = entries.filter(function (e) { return !e.parent && (flt === "all" || (flt === "wins" && e.kind === "win") || (flt === "skool" && e.kind === "skool")) && (matches(e, q) || kidsOf(e.id).some(function (k) { return matches(k, q); })); });
    var i = vis.findIndex(function (e) { return e.id === id; }), j = i + dir; if (i < 0 || j < 0 || j >= vis.length) return;
    var a = entries.indexOf(vis[i]), b = entries.indexOf(vis[j]), t = entries[a]; entries[a] = entries[b]; entries[b] = t; afterChange();
  }

  // events
  document.getElementById("q").addEventListener("input", renderFeed);
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return; e.preventDefault();
    var t = this.value.trim(); if (!t) return;
    this.value = ""; addEntry("win", t.slice(0, 140));
  });
  document.getElementById("stats").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (b) {
      if (b.disabled) return; var k = b.dataset.k, d = Number(b.dataset.d), day = tgt();
      if (d > 0) { addEntry(k === "wins" ? "win" : "skool", "Skool session"); return; }
      var last = null; for (var i = 0; i < entries.length; i++) if (entries[i].kind === (k === "wins" ? "win" : "skool") && entries[i].day === day) last = entries[i];
      if (last) removeEntry(last.id); return;
    }
    var bx = e.target.closest(".stat"); if (bx) { flt = flt === bx.dataset.filter ? "all" : bx.dataset.filter; clubFrom = null; renderStats(); renderFeed(); }
  });
  document.getElementById("stats").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("stat")) { e.preventDefault(); e.target.click(); }
  });
  var fl = document.getElementById("feedList");
  fl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var act = b.dataset.act, id = Number(b.dataset.id), i = Number(b.dataset.i);
    if (act === "up") swap(id, -1); else if (act === "down") swap(id, 1);
    else if (act === "edit") { editing = id; renderFeed(); }
    else if (act === "del") removeEntry(id);
    else if (act === "club") { clubFrom = id; renderFeed(); }
    else if (act === "cancelclub") { clubFrom = null; renderFeed(); }
    else if (act === "clubto") {
      var src = byId(clubFrom), dst = byId(id); if (!src || !dst || src.id === dst.id) return;
      kidsOf(src.id).forEach(function (k) { k.parent = dst.id; }); src.parent = dst.id; clubFrom = null; afterChange(); live.textContent = "Clubbed. Both still count.";
    }
    else if (act === "unclub") { var k = byId(id); if (k) { k.parent = null; afterChange(); } }
    else if (act === "cstep") { var cur = data[i].commits, nv = Math.max(0, cur + Number(b.dataset.d)); var bb = snap(); overrides[i] = nv; if (nv === base[i].c0) delete overrides[i]; afterChange(); }
    else if (act === "creset") { delete overrides[i]; afterChange(); }
    else if (act === "clearflt") { flt = "all"; renderStats(); renderFeed(); }
    else if (act === "today") { sel = null; afterChange(); }
  });
  fl.addEventListener("keydown", function (e) {
    if (e.target.classList.contains("editin")) {
      var id = Number(e.target.dataset.edit);
      if (e.key === "Enter") { e.preventDefault(); var t = e.target.value.trim(), en = byId(id); if (t && en) en.text = t.slice(0, 140); editing = null; afterChange(); }
      else if (e.key === "Escape") { editing = null; renderFeed(); }
    } else if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.act === "clubto") { e.preventDefault(); e.target.click(); }
  });
  document.getElementById("status").addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b) return;
    if (b.dataset.act === "today") { sel = null; afterChange(); }
    else if (b.dataset.act === "clearflt") { flt = "all"; renderStats(); renderFeed(); }
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && clubFrom !== null) { clubFrom = null; renderFeed(); } });

  // load
  try {
    var sv = JSON.parse(localStorage.getItem("amiw-demo5") || "null");
    if (sv && Array.isArray(sv.e) && sv.o && typeof sv.o === "object") {
      var ok = sv.e.every(function (e) { return e && (e.kind === "win" || e.kind === "skool") && Number.isInteger(e.day) && e.day >= 0 && e.day < DAYS && typeof e.text === "string" && Number.isInteger(e.id); });
      if (ok) { entries = sv.e; overrides = sv.o; nid = Number.isInteger(sv.n) ? sv.n : 1000; }
    }
  } catch (e) {}
  recompute(); for (var j = 0; j < DAYS; j++) paint(j); renderStats(); renderFeed();
  var sc = document.getElementById("chartScroll"); sc.scrollLeft = sc.scrollWidth;
})();
</script>
</body>
</html>
