<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily record entry demo</title>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --tile: #eeeeeb; --border: #d6d5cf;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --green: #1a7f37; --red: #cf222e; --redbg: #ffebe9;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #0d1117; --tile: #1c2128; --border: #30363d;
    --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --green: #3fb950; --red: #f47067; --redbg: #3a1d20;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #0d1117; --tile: #1c2128; --border: #30363d;
  --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --green: #3fb950; --red: #f47067; --redbg: #3a1d20;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-1); color: var(--text-primary); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
.badge { display: inline-block; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
h1 { font-size: 20px; margin: 10px 0 18px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--text-primary); outline-offset: 2px; }

.chart-scroll { overflow-x: auto; padding: 3px 4px 6px 0; }
.chart { min-width: 560px; }
.months { position: relative; height: 18px; margin-left: 34px; font-size: 12px; color: var(--text-muted); }
.months span { position: absolute; }
.body { display: flex; }
.wd { display: grid; grid-template-rows: repeat(7, 22px); gap: 3px; width: 34px; flex: none; font-size: 12px; color: var(--text-muted); }
.wd span { line-height: 22px; }
.grid { flex: 1; display: grid; grid-auto-flow: column; grid-template-columns: repeat(20, minmax(0, 1fr)); grid-template-rows: repeat(7, 22px); gap: 3px; }
.cell { border-radius: 4px; background: var(--tile); padding: 3px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; cursor: pointer; outline-offset: 2px; }
.cell:focus-visible { outline: 2px solid var(--text-primary); }
.cell.today { box-shadow: 0 0 0 2px var(--text-primary); }
.cell.sel { box-shadow: 0 0 0 2px var(--s3); }
.cell.today.sel { box-shadow: 0 0 0 2px var(--s3), 0 0 0 4px var(--text-primary); }
.lane { height: 4px; border-radius: 2px; }
.fill { height: 4px; border-radius: 2px; width: 0; }
.fill.a { background: var(--s1); } .fill.b { background: var(--s2); } .fill.c { background: var(--s3); }
.pop { animation: pop .5s ease; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-secondary); }
.legend .item { display: inline-flex; align-items: center; gap: 6px; }

.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stat.clickable { cursor: pointer; }
.stat.hero { border-color: var(--s3); }
.stat.active { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.stat .info { min-width: 0; }
.stat .n { font-size: 22px; font-weight: 650; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.ctl { display: flex; align-items: center; gap: 6px; }
.td { font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.td b { color: var(--text-primary); font-size: 14px; }
.mini { width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: transparent; color: var(--text-primary); font-size: 17px; line-height: 1; }
.mini:hover { background: var(--tile); }
.mini:disabled { opacity: .35; cursor: default; }

.feed { margin-top: 14px; }
.searchbar { display: flex; align-items: center; gap: 10px; background: var(--tile); border-radius: 10px; padding: 0 14px; height: 44px; color: var(--text-muted); }
.searchbar input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--text-primary); font: inherit; font-size: 15px; height: 100%; }
.searchbar input:focus-visible { outline: none; }
.searchbar:focus-within { outline: 2px solid var(--text-primary); outline-offset: 2px; }
.count { font-size: 13px; white-space: nowrap; }
.banner { margin-top: 12px; padding: 10px 12px; border: 1px dashed var(--green); border-radius: 10px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.linkbtn { background: none; border: 0; color: var(--text-primary); text-decoration: underline; padding: 0; font-size: 13px; }

/* GitHub-style activity timeline */
.tmonth { display: flex; align-items: center; gap: 12px; margin: 26px 0 8px; font-size: 14px; }
.tmonth b { font-weight: 600; } .tmonth span { color: var(--text-muted); }
.tmonth::after { content: ""; flex: 1; border-top: 1px solid var(--border); }
.tg { position: relative; padding: 0 0 22px 46px; }
.tg::before { content: ""; position: absolute; left: 15px; top: 34px; bottom: 0; border-left: 2px solid var(--border); }
.tg:last-child::before { display: none; }
.ic { position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%; background: var(--tile); display: grid; place-items: center; color: var(--text-secondary); }
.tg h3 { margin: 0; font-size: 16px; font-weight: 400; min-height: 32px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tg h3 b { font-weight: 600; }
.when { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
.tr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 0; }
.tr + .tr { border-top: 1px solid var(--border); }
.tr .t { flex: 1; min-width: 150px; overflow-wrap: anywhere; }
.tr .m { font-size: 12px; color: var(--text-muted); }
.note2 { font-size: 12px; color: var(--green); }
.btns { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.bt { font-size: 12px; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); }
.bt:hover:not(:disabled) { background: var(--tile); color: var(--text-primary); }
.bt:disabled { opacity: .3; cursor: default; }
.bt.ok { color: var(--green); border-color: var(--green); }
.bt.no { color: var(--red); border-color: var(--red); }
.bt.no.solid { background: var(--red); color: #fff; }
.bt.arrow { padding: 3px 8px; }
.confirm { flex: 1 1 100%; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; background: var(--redbg); border: 1px solid var(--red); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.kids { flex: 1 1 100%; margin: 2px 0 0; padding-left: 12px; border-left: 2px solid var(--green); }
.kids .tr { padding: 6px 0; }
.editin { width: 100%; font: inherit; font-size: 15px; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--green); border-radius: 8px; padding: 6px 8px; }
.empty { margin-top: 18px; color: var(--text-muted); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.35); display: none; gap: 14px; align-items: center; font-size: 14px; z-index: 20; }
.toast .bt { color: var(--text-primary); }
.tip { position: fixed; z-index: 10; pointer-events: none; display: none; background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.25); min-width: 170px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.note { margin-top: 24px; color: var(--text-muted); font-size: 13px; }
@media (max-width: 560px) { .stats { grid-template-columns: 1fr; } .count { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <span class="badge">Demo, made up history</span>
  <h1>Daily record</h1>

  <div class="chart-scroll" id="chartScroll">
    <div class="chart">
      <div class="months" id="months"></div>
      <div class="body">
        <div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="grid" id="grid" role="group" aria-label="Activity grid, 20 weeks. Press a day to see just that day."></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span class="item"><i class="dot" style="background:var(--s1)"></i>Commits (top bar)</span>
    <span class="item"><i class="dot" style="background:var(--s2)"></i>Skool (middle bar)</span>
    <span class="item"><i class="dot" style="background:var(--s3)"></i>Wins (bottom bar)</span>
    <span>Click a day to see just that day. Click it again to go back.</span>
  </div>

  <div class="stats" id="stats"></div>

  <section class="feed" aria-label="Win log">
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search, or type a win and press Enter" aria-label="Search the log, or type a win and press Enter to add it">
      <span id="count" class="count"></span>
    </div>
    <div id="feedList"></div>
  </section>

  <p class="note">Demo only. Everything here stays in this browser. The real tracker saves it to a file on your server.</p>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button class="bt" id="toastUndo">Undo</button></div>
<div class="tip" id="tip"></div>

<script>
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(2611);
  var WEEKS = 20, DAYS = WEEKS * 7, todayI = DAYS - 1;
  var end = Date.UTC(2026, 10, 8), start = end - (DAYS - 1) * 864e5;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmt(d) { return WD[(d.getUTCDay() + 6) % 7] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function hhmm() { return new Date().toTimeString().slice(0, 5); }

  // made-up history
  var base = [];
  for (var i = 0; i < DAYS; i++) {
    var w = i % 7, vanish = (i > 78 && i < 83) || (i > 112 && i < 115), isT = i === todayI;
    base.push({ d: new Date(start + i * 864e5), c0: vanish ? 0 : Math.floor(rand() * (w > 4 ? 9 : 5)),
      s0: !isT && i > 118 ? (rand() < 0.7 ? 1 : 0) : 0, w0: !isT && i > 124 && !vanish ? (rand() < 0.3 ? 1 : 0) : 0 });
  }
  var SAMPLE = ["Sent my first 3 outreach messages", "Friend replied, wants to talk about his Excel work", "Prospect list reached 30 names", "Tested the message on 3 people", "Booked an intro call", "Finished the Skool niche lesson", "Posted my baseline in the community", "Shipped the tracker demo"];
  var nid = 1, entries = [], overrides = {}, skoolC = base.map(function (b) { return b.s0; });
  var sel = null, flt = "all", editing = null, clubFrom = null, confirmDel = null, undoSnap = null, toastT = null;
  function mk(day, text, time) { return { id: nid++, kind: "win", day: day, text: text, time: time, parent: null }; }
  (function seed() {
    var k = 0;
    base.forEach(function (x, i) {
      if (i >= todayI) return;
      for (var n = 0; n < x.w0; n++) entries.push(mk(i, SAMPLE[k++ % SAMPLE.length], ("0" + (9 + ((i * 7 + n * 3) % 11))).slice(-2) + ":" + ("0" + ((i * 13 + n * 17) % 60)).slice(-2)));
    });
    entries.reverse();
  })();

  var data = base.map(function (x) { return { d: x.d, commits: x.c0, skool: 0, wins: 0 }; });
  function recompute() {
    data.forEach(function (x, i) { x.commits = overrides[i] !== undefined ? overrides[i] : base[i].c0; x.skool = skoolC[i]; x.wins = 0; });
    entries.forEach(function (e) { data[e.day].wins++; });
  }
  function tgt() { return sel === null ? todayI : sel; }
  function byId(id) { for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i]; return null; }
  function kidsOf(id) { return entries.filter(function (e) { return e.parent === id; }); }
  function snap() { return JSON.stringify({ e: entries, o: overrides, n: nid, s: skoolC }); }
  function restore(s) { var o = JSON.parse(s); entries = o.e; overrides = o.o; nid = o.n; skoolC = o.s; afterChange(); }

  // grid
  var cells = [], grid = document.getElementById("grid"), tip = document.getElementById("tip");
  var KEYS = ["commits", "skool", "wins"], CAPS = { commits: 8, skool: 2, wins: 2 }, CL = ["a", "b", "c"];
  function paint(i) {
    var x = data[i], c = cells[i], f = c.querySelectorAll(".fill");
    c.className = "cell" + (i === todayI ? " today" : "") + (i === sel ? " sel" : "");
    c.setAttribute("aria-label", fmt(x.d) + ": " + x.commits + " commits, " + x.skool + " Skool, " + x.wins + " wins" + (i === sel ? ", selected" : ""));
    c.setAttribute("aria-pressed", String(i === sel));
    for (var k = 0; k < 3; k++) { var v = x[KEYS[k]]; f[k].style.width = v ? Math.max(28, Math.min(100, v / CAPS[KEYS[k]] * 100)) + "%" : "0%"; }
  }
  base.forEach(function (b, i) {
    var c = document.createElement("div"); c.tabIndex = 0; c.setAttribute("role", "button");
    CL.forEach(function (cl) { var lane = document.createElement("div"); lane.className = "lane"; var f = document.createElement("div"); f.className = "fill " + cl; lane.appendChild(f); c.appendChild(lane); });
    function show() {
      var r = c.getBoundingClientRect(), x = data[i];
      tip.innerHTML = "<b>" + fmt(x.d) + (i === todayI ? " (today)" : "") + "</b>" +
        '<div><i class="dot" style="background:var(--s1)"></i>' + x.commits + " commits</div>" +
        '<div><i class="dot" style="background:var(--s2)"></i>' + x.skool + " Skool</div>" +
        '<div><i class="dot" style="background:var(--s3)"></i>' + x.wins + " wins</div>";
      tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = (r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + "px";
    }
    function hide() { tip.style.display = "none"; }
    c.addEventListener("pointerenter", show); c.addEventListener("pointerleave", hide);
    c.addEventListener("focus", show); c.addEventListener("blur", hide);
    function pick() { sel = sel === i ? null : i; clubFrom = null; confirmDel = null; editing = null; afterChange(); }
    c.addEventListener("click", pick);
    c.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    cells.push(c); grid.appendChild(c);
  });
  var months = document.getElementById("months"), lastM = -1;
  for (var wk = 0; wk < WEEKS; wk++) {
    var md = new Date(start + wk * 7 * 864e5);
    if (md.getUTCMonth() !== lastM) { var sp = document.createElement("span"); sp.textContent = MON[md.getUTCMonth()]; sp.style.left = (wk / WEEKS * 100) + "%"; months.appendChild(sp); lastM = md.getUTCMonth(); }
  }

  // stat boxes: only the Skool box changes numbers; the Commits box switches the list to commit days
  function sum(k) { return data.slice(-7).reduce(function (t, x) { return t + x[k]; }, 0); }
  function daysWith(k) { return data.slice(-7).filter(function (x) { return x[k] > 0; }).length; }
  function dayWord() { return sel === null ? "Today" : data[sel].d.getUTCDate() + " " + MON[data[sel].d.getUTCMonth()]; }
  function ctl(kind) {
    var v = data[tgt()][kind], w = esc(dayWord());
    if (kind !== "skool") return '<div class="td">' + w + ' <b>' + v + '</b></div>';
    return '<div class="ctl"><span class="td">' + w + ' <b>' + v + '</b></span>' +
      '<button class="mini" data-act="step" data-d="-1" aria-label="Remove one Skool on ' + w + '"' + (v === 0 ? " disabled" : "") + '>&minus;</button>' +
      '<button class="mini" data-act="step" data-d="1" aria-label="Add one Skool on ' + w + '">+</button></div>';
  }
  function box(f, cls, color, n, label, right, clickable) {
    var attrs = clickable ? ' data-filter="' + f + '" tabindex="0" role="button" aria-pressed="' + (flt === f) + '" aria-label="' + label + ', press to show commits per day"' : "";
    return '<div class="stat ' + cls + (clickable ? " clickable" : "") + (clickable && flt === f ? " active" : "") + '"' + attrs + '><div class="info"><div class="n">' + n + '</div><div class="l"><i class="dot" style="background:var(' + color + ')"></i>' + label + '</div></div>' + right + '</div>';
  }
  function renderStats() {
    document.getElementById("stats").innerHTML =
      box("wins", "hero", "--s3", sum("wins"), "Wins this week", ctl("wins"), false) +
      box("skool", "", "--s2", daysWith("skool"), "Skool days", ctl("skool"), false) +
      box("commits", "", "--s1", sum("commits"), "Commits", '<div class="td">' + (flt === "commits" ? "showing days" : "from GitHub") + '</div>', true);
  }

  // activity list (wins only)
  var ICON_WIN = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 .5l2.2 4.6 5 .7-3.6 3.5.9 5L8 11.9 3.5 14.3l.9-5L.8 5.8l5-.7z"/></svg>';
  var ICON_GIT = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 5a3 3 0 100 6 3 3 0 000-6zM1 7.25h3.5v1.5H1zm10.5 0H15v1.5h-3.5z"/></svg>';
  function matches(e, q) { var d = base[e.day].d; return !q || (fmt(d) + " " + FULL[d.getUTCMonth()] + " " + e.text).toLowerCase().indexOf(q) !== -1; }
  function inDay(e) { return sel === null || e.day === sel || kidsOf(e.id).some(function (k) { return k.day === sel; }); }
  function visibleTop(q) { return entries.filter(function (e) { return !e.parent && inDay(e) && (matches(e, q) || kidsOf(e.id).some(function (k) { return matches(k, q); })); }); }
  function textHtml(e) {
    return editing === e.id ? '<input class="editin" data-edit="' + e.id + '" value="' + esc(e.text) + '" maxlength="140" aria-label="Edit the win, Enter to save, Escape to cancel">' : esc(e.text);
  }
  function btns(e, idx, n, isKid) {
    if (confirmDel === e.id) return "";
    return '<div class="btns">' + (isKid ? '<button class="bt" data-act="unclub" data-id="' + e.id + '">Unclub</button>' :
        '<button class="bt arrow" data-act="up" data-id="' + e.id + '"' + (idx === 0 ? " disabled" : "") + ' aria-label="Move up">&uarr;</button>' +
        '<button class="bt arrow" data-act="down" data-id="' + e.id + '"' + (idx === n - 1 ? " disabled" : "") + ' aria-label="Move down">&darr;</button>' +
        '<button class="bt" data-act="club" data-id="' + e.id + '">Club</button>') +
      '<button class="bt ok" data-act="edit" data-id="' + e.id + '">Edit</button>' +
      '<button class="bt no" data-act="ask" data-id="' + e.id + '">Delete</button></div>';
  }
  function confirmHtml(e) {
    return confirmDel === e.id ? '<div class="confirm" role="alertdialog" aria-label="Confirm delete"><span>Delete this win?</span><button class="bt no solid" data-act="del" data-id="' + e.id + '">Yes, delete</button><button class="bt" data-act="cancel">Cancel</button></div>' : "";
  }
  function row(e, idx, n, isKid, pickable) {
    var kids = isKid ? [] : kidsOf(e.id);
    return '<div class="tr"' + (pickable ? ' data-act="clubto" data-id="' + e.id + '" tabindex="0" role="button" style="cursor:pointer"' : "") + '>' +
      '<span class="t">' + textHtml(e) + '</span><span class="m">' + (isKid ? fmt(base[e.day].d) : (e.time || "")) + '</span>' +
      (kids.length ? '<span class="note2">clubbed, counts as ' + (kids.length + 1) + ' wins</span>' : "") +
      btns(e, idx, n, isKid) + confirmHtml(e) +
      (kids.length ? '<div class="kids">' + kids.map(function (k) { return row(k, 0, 0, true, false); }).join("") + '</div>' : "") + '</div>';
  }
  function commitGroup(i) {
    var x = data[i], o = overrides[i] !== undefined;
    return '<div class="tg"><div class="ic">' + ICON_GIT + '</div><h3><span>Created <b>' + x.commits + '</b> ' + (x.commits === 1 ? "commit" : "commits") + ' on <b>' + esc(fmt(x.d)) + '</b></span><span class="when">' + x.d.getUTCDate() + ' ' + MON[x.d.getUTCMonth()] + '</span></h3>' +
      '<div class="tr"><span class="t">GitHub says ' + base[i].c0 + (o ? ', you set ' + x.commits : "") + '</span><span class="btns">' +
      '<button class="mini" data-act="cstep" data-i="' + i + '" data-d="-1" aria-label="Count one fewer commit on ' + esc(fmt(x.d)) + '"' + (x.commits === 0 ? " disabled" : "") + '>&minus;</button>' +
      '<button class="mini" data-act="cstep" data-i="' + i + '" data-d="1" aria-label="Count one more commit on ' + esc(fmt(x.d)) + '">+</button>' +
      (o ? '<button class="bt" data-act="creset" data-i="' + i + '">Reset</button>' : "") + '</span></div></div>';
  }
  function monthHead(d) { return '<div class="tmonth"><b>' + FULL[d.getUTCMonth()] + '</b><span>' + d.getUTCFullYear() + '</span></div>'; }

  function renderFeed() {
    var q = (document.getElementById("q").value || "").trim().toLowerCase(), html = "", lastKey = "";
    var onDay = sel === null ? "" : " on " + data[sel].d.getUTCDate() + " " + MON[data[sel].d.getUTCMonth()];
    if (clubFrom !== null && byId(clubFrom)) html += '<div class="banner"><span>Pick the win to club <b>' + esc(byId(clubFrom).text) + '</b> into. It still counts as its own win.</span><button class="linkbtn" data-act="cancelclub">Cancel</button></div>';
    if (flt === "commits") {
      var days = []; for (var i = DAYS - 1; i >= 0; i--) if ((sel === null || i === sel) && (base[i].c0 > 0 || overrides[i] !== undefined) && (!q || (fmt(base[i].d) + " " + FULL[base[i].d.getUTCMonth()] + " commits").toLowerCase().indexOf(q) !== -1)) days.push(i);
      days.slice(0, 40).forEach(function (i) { var d = base[i].d, key = d.getUTCFullYear() + "-" + d.getUTCMonth(); if (key !== lastKey) { html += monthHead(d); lastKey = key; } html += commitGroup(i); });
      if (!days.length) html += '<p class="empty">No commit days match.</p>';
      if (days.length > 40) html += '<p class="empty">Showing the latest 40 days. Search to find older ones.</p>';
      document.getElementById("count").textContent = days.length + (days.length === 1 ? " day" : " days");
    } else {
      var vis = visibleTop(q), groups = [], gi = {};
      vis.forEach(function (e) { if (gi[e.day] === undefined) { gi[e.day] = groups.length; groups.push({ day: e.day, items: [] }); } groups[gi[e.day]].items.push(e); });
      document.getElementById("count").textContent = (q ? vis.length + " matching" : vis.length + (vis.length === 1 ? " win" : " wins")) + onDay + (q ? " · Enter adds a win" : "");
      groups.forEach(function (g) {
        var d = base[g.day].d, key = d.getUTCFullYear() + "-" + d.getUTCMonth();
        if (key !== lastKey) { html += monthHead(d); lastKey = key; }
        var total = data[g.day].wins;
        html += '<div class="tg"><div class="ic">' + ICON_WIN + '</div><h3><span><b>' + total + '</b> ' + (total === 1 ? "win" : "wins") + ' on <b>' + esc(fmt(d)) + '</b></span><span class="when">' + d.getUTCDate() + ' ' + MON[d.getUTCMonth()] + '</span></h3>' +
          g.items.map(function (e, idx) { return row(e, idx, g.items.length, false, clubFrom !== null && clubFrom !== e.id); }).join("") + '</div>';
      });
      if (!vis.length) html += '<p class="empty">' + (q ? "No match. Press Enter to add it as a win." : (sel === null ? "No wins yet. Type one above and press Enter." : "No wins on this day.")) + "</p>";
    }
    document.getElementById("feedList").innerHTML = html;
    var ed = document.querySelector(".editin"); if (ed) { ed.focus(); ed.setSelectionRange(ed.value.length, ed.value.length); }
  }

  var live = document.getElementById("live"), toast = document.getElementById("toast");
  function save() { try { localStorage.setItem("amiw-demo7", snap()); } catch (e) {} }
  function afterChange() { recompute(); for (var i = 0; i < DAYS; i++) paint(i); renderStats(); renderFeed(); save(); }
  function popDay(i) { cells[i].classList.add("pop"); setTimeout(function () { cells[i].classList.remove("pop"); }, 600); }
  function showToast(msg, before) {
    undoSnap = before; document.getElementById("toastMsg").textContent = msg; toast.style.display = "flex";
    clearTimeout(toastT); toastT = setTimeout(function () { toast.style.display = "none"; undoSnap = null; }, 10000);
  }
  document.getElementById("toastUndo").onclick = function () { if (undoSnap) { restore(undoSnap); undoSnap = null; live.textContent = "Restored."; } toast.style.display = "none"; };
  function addWin(text) {
    var day = tgt(), e = mk(day, text, hhmm()), at = entries.findIndex(function (x) { return !x.parent && x.day <= day; });
    if (at < 0) entries.push(e); else entries.splice(at, 0, e);
    afterChange(); popDay(day); live.textContent = "Win added to " + fmt(base[day].d);
  }
  function removeWin(id) {
    var e = byId(id); if (!e) return; var before = snap();
    kidsOf(id).forEach(function (k) { k.parent = null; });
    entries = entries.filter(function (x) { return x.id !== id; }); confirmDel = null;
    afterChange(); showToast("Deleted: " + e.text.slice(0, 40), before);
  }
  function swap(id, dir) {
    var e = byId(id); if (!e) return;
    var q = (document.getElementById("q").value || "").trim().toLowerCase();
    var same = visibleTop(q).filter(function (x) { return x.day === e.day; });
    var i = same.findIndex(function (x) { return x.id === id; }), j = i + dir; if (i < 0 || j < 0 || j >= same.length) return;
    var a = entries.indexOf(same[i]), b = entries.indexOf(same[j]), t = entries[a]; entries[a] = entries[b]; entries[b] = t; afterChange();
  }

  // events
  var qEl = document.getElementById("q");
  qEl.addEventListener("input", renderFeed);
  qEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return; e.preventDefault();
    var t = this.value.trim(); if (!t) return;
    this.value = ""; addWin(t.slice(0, 140));
  });
  document.getElementById("stats").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (b) {
      if (b.disabled) return; var d = Number(b.dataset.d), day = tgt();
      skoolC[day] = Math.max(0, skoolC[day] + d); afterChange(); if (d > 0) popDay(day);
      live.textContent = "Skool on " + fmt(base[day].d) + ": " + skoolC[day]; return;
    }
    var bx = e.target.closest(".stat.clickable"); if (bx) { flt = flt === "commits" ? "all" : "commits"; clubFrom = null; confirmDel = null; editing = null; renderStats(); renderFeed(); }
  });
  document.getElementById("stats").addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList.contains("stat")) { e.preventDefault(); e.target.click(); }
  });
  var fl = document.getElementById("feedList");
  fl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    if (b.dataset.act === "clubto" && e.target.closest("button")) return;
    var act = b.dataset.act, id = Number(b.dataset.id), i = Number(b.dataset.i);
    if (act === "up") swap(id, -1); else if (act === "down") swap(id, 1);
    else if (act === "edit") { editing = id; confirmDel = null; renderFeed(); }
    else if (act === "ask") { confirmDel = id; editing = null; renderFeed(); }
    else if (act === "cancel") { confirmDel = null; renderFeed(); }
    else if (act === "del") removeWin(id);
    else if (act === "club") { clubFrom = id; confirmDel = null; renderFeed(); }
    else if (act === "cancelclub") { clubFrom = null; renderFeed(); }
    else if (act === "clubto") {
      var src = byId(clubFrom), dst = byId(id); if (!src || !dst || src.id === dst.id) return;
      kidsOf(src.id).forEach(function (k) { k.parent = dst.id; }); src.parent = dst.id; clubFrom = null; afterChange(); live.textContent = "Clubbed. Both still count.";
    }
    else if (act === "unclub") { var k = byId(id); if (k) { k.parent = null; afterChange(); } }
    else if (act === "cstep") { var nv = Math.max(0, data[i].commits + Number(b.dataset.d)); if (nv === base[i].c0) delete overrides[i]; else overrides[i] = nv; afterChange(); }
    else if (act === "creset") { delete overrides[i]; afterChange(); }
  });
  fl.addEventListener("keydown", function (e) {
    if (e.target.classList.contains("editin")) {
      var id = Number(e.target.dataset.edit);
      if (e.key === "Enter") { e.preventDefault(); var t = e.target.value.trim(), en = byId(id); if (t && en) en.text = t.slice(0, 140); editing = null; afterChange(); }
      else if (e.key === "Escape") { editing = null; renderFeed(); }
    } else if ((e.key === "Enter" || e.key === " ") && e.target.dataset && e.target.dataset.act === "clubto") { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape" || editing !== null) return;
    if (confirmDel !== null) { confirmDel = null; renderFeed(); }
    else if (clubFrom !== null) { clubFrom = null; renderFeed(); }
    else if (sel !== null) { sel = null; afterChange(); }
  });

  // load
  try {
    var sv = JSON.parse(localStorage.getItem("amiw-demo7") || "null");
    if (sv && Array.isArray(sv.e) && sv.o && typeof sv.o === "object" && Array.isArray(sv.s) && sv.s.length === DAYS && sv.s.every(Number.isInteger)) {
      var ok = sv.e.every(function (e) { return e && e.kind === "win" && Number.isInteger(e.day) && e.day >= 0 && e.day < DAYS && typeof e.text === "string" && Number.isInteger(e.id); });
      if (ok) { entries = sv.e; overrides = sv.o; skoolC = sv.s.map(function (v) { return Math.max(0, v); }); nid = Number.isInteger(sv.n) ? sv.n : 1000; }
    }
  } catch (e) {}
  recompute(); for (var j = 0; j < DAYS; j++) paint(j); renderStats(); renderFeed();
  var sc = document.getElementById("chartScroll"); sc.scrollLeft = sc.scrollWidth;
})();
</script>
</body>
</html>
