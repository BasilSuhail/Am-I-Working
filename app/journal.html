<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal · Am I Working</title>
<script>try{var t=localStorage.getItem("amiw-jtheme");if(t==="light"||t==="dark"||t==="paper"||t==="classic")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --tile: #eeeeeb; --border: #d6d5cf; --side: #f4f3f0;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;
  --accent: #2a78d6; --green: #1a7f37; --red: #cf222e; --code: #efeeea;
}
:root:where(:not([data-theme="light"])) { }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]):not([data-theme="paper"]):not([data-theme="classic"]) {
    color-scheme: dark;
    --surface-1: #0d1117; --tile: #1c2128; --border: #30363d; --side: #11161d;
    --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
    --accent: #3987e5; --green: #3fb950; --red: #f47067; --code: #1c2128;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #0d1117; --tile: #1c2128; --border: #30363d; --side: #11161d;
  --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
  --accent: #3987e5; --green: #3fb950; --red: #f47067; --code: #1c2128;
}
:root[data-theme="paper"] {
  --surface-1: #f6efd9; --tile: #ebe2c5; --border: #d3c7a0; --side: #efe6c9;
  --text-primary: #2b2416; --text-secondary: #5a4f36; --text-muted: #857a5c;
  --accent: #2a6fc4; --green: #1f7a3a; --red: #b3261e; --code: #ebe2c5;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--surface-1); color: var(--text-primary); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button { font: inherit; color: inherit; background: var(--tile); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
button.ghost { background: none; border-color: transparent; }
input[type=search] { font: inherit; color: inherit; background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; width: 100%; }

.app { display: grid; grid-template-rows: 38px 1fr 24px; height: 100vh; }
.top { display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--side); }
.top b { font-weight: 650; }
.top .sp { flex: 1; }
.top a { color: var(--text-secondary); text-decoration: none; }
.top a:hover { color: var(--accent); }
.body { display: grid; grid-template-columns: 250px 1fr; min-height: 0; }

/* sidebar */
.side { border-right: 1px solid var(--border); background: var(--side); display: flex; flex-direction: column; min-height: 0; }
.side .tools { padding: 10px; display: grid; gap: 6px; }
.side .tools .row { display: flex; gap: 6px; }
.side .tools .row button { flex: 1; }
.tree { overflow: auto; padding: 0 6px 12px; flex: 1; }
.grp { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 6px 3px; }
.f { display: flex; align-items: baseline; gap: 6px; padding: 3px 8px; border-radius: 5px; cursor: pointer; }
.f:hover { background: var(--tile); }
.f.act { background: var(--tile); box-shadow: inset 2px 0 0 var(--accent); }
.f .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.f .d { color: var(--text-muted); font-size: 11px; }
.root { color: var(--text-muted); font-size: 11px; padding: 8px 12px; border-top: 1px solid var(--border); word-break: break-all; }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.tabs { display: flex; background: var(--side); border-bottom: 1px solid var(--border); overflow-x: auto; min-height: 32px; }
.tab { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-right: 1px solid var(--border); cursor: pointer; white-space: nowrap; color: var(--text-secondary); }
.tab.act { background: var(--surface-1); color: var(--text-primary); box-shadow: inset 0 2px 0 var(--accent); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); visibility: hidden; }
.tab.dirty .dot { visibility: visible; }
.tab .x { color: var(--text-muted); }
.tab .x:hover { color: var(--red); }
.bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.bar .sp { flex: 1; }
.bar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.panes { display: grid; flex: 1; min-height: 0; }
.panes.split { grid-template-columns: 1fr 1fr; }
.panes.edit { grid-template-columns: 1fr; }
.panes.view { grid-template-columns: 1fr; }
.panes.edit .prev, .panes.view .ed { display: none; }
.ed { border-right: 1px solid var(--border); min-width: 0; }
.panes.edit .ed { border-right: 0; }
textarea { width: 100%; height: 100%; border: 0; outline: 0; resize: none; padding: 16px 20px; background: var(--surface-1); color: var(--text-primary); font: 13.5px/1.65 ui-monospace, "SF Mono", Menlo, Consolas, monospace; tab-size: 2; }
.prev { overflow: auto; padding: 16px 28px 60px; min-width: 0; }
.empty { margin: auto; color: var(--text-muted); text-align: center; padding: 40px; }
.empty b { display: block; color: var(--text-primary); font-size: 16px; margin-bottom: 4px; }

/* status bar */
.status { display: flex; gap: 16px; align-items: center; padding: 0 12px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); background: var(--side); white-space: nowrap; overflow: hidden; }
.status .sp { flex: 1; }
.ok { color: var(--green); } .bad { color: var(--red); }
.status button { padding: 0 6px; font-size: 12px; }

/* rendered markdown */
.md { max-width: 760px; margin: 0 auto; }
.md h1 { font-size: 1.7em; margin: .2em 0 .5em; border-bottom: 1px solid var(--border); padding-bottom: .2em; }
.md h2 { font-size: 1.3em; margin: 1.4em 0 .4em; border-bottom: 1px solid var(--border); padding-bottom: .15em; }
.md h3 { font-size: 1.1em; margin: 1.2em 0 .3em; }
.md p, .md ul, .md ol, .md blockquote, .md table, .md pre { margin: .55em 0; }
.md ul, .md ol { padding-left: 1.5em; }
.md li.task { list-style: none; margin-left: -1.3em; }
.md li.task input { margin-right: 7px; vertical-align: -1px; }
.md li.done { color: var(--text-muted); text-decoration: line-through; }
.md code { background: var(--code); border-radius: 4px; padding: 1px 5px; font: .9em ui-monospace, Menlo, monospace; }
.md pre { background: var(--code); border-radius: 6px; padding: 10px 12px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { border-left: 3px solid var(--border); margin-left: 0; padding-left: 12px; color: var(--text-secondary); }
.md table { border-collapse: collapse; }
.md th, .md td { border: 1px solid var(--border); padding: 4px 10px; text-align: left; }
.md th { background: var(--tile); }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 1.2em 0; }
.md a { color: var(--accent); }
.md .meta { background: var(--tile); border-radius: 6px; padding: 8px 12px; margin-bottom: 14px; color: var(--text-secondary); font-size: 12.5px; }
.md time, .md .stamp { color: var(--text-muted); font-size: .85em; }

/* ---------- Classic: old black-and-white Mac, slow and easy ---------- */
:root[data-theme="classic"] {
  color-scheme: light;
  --surface-1: #ffffff; --tile: #ffffff; --border: #000000; --side: #ffffff;
  --text-primary: #000000; --text-secondary: #000000; --text-muted: #555555;
  --accent: #000000; --green: #000000; --red: #000000; --code: #f0f0f0;
}
:root[data-theme="classic"] body { background-color: #fff; background-image: linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%),linear-gradient(45deg,#000 25%,transparent 25%,transparent 75%,#000 75%); background-size: 4px 4px; background-position: 0 0, 2px 2px; padding: 16px 22px 22px 16px; font-family: "Geneva","Chicago","Monaco","Lucida Grande",sans-serif; font-size: 13px; }
:root[data-theme="classic"] .app { height: calc(100vh - 38px); background: #fff; border: 2px solid #000; box-shadow: 4px 4px 0 #000; grid-template-rows: 26px 1fr 22px; }
:root[data-theme="classic"] .top { border-bottom: 2px solid #000; background: repeating-linear-gradient(#fff 0 2px,#000 2px 3px); padding: 0 8px; gap: 8px; }
:root[data-theme="classic"] .top b, :root[data-theme="classic"] .top > span:not(.sp), :root[data-theme="classic"] .top a, :root[data-theme="classic"] .top select { background: #fff; padding: 0 8px; color: #000; line-height: 18px; }
:root[data-theme="classic"] .top b::before { content: "\25A1  "; }
:root[data-theme="classic"] .top select { border: 1px solid #000; border-radius: 0; font-size: 12px; }
:root[data-theme="classic"] button { background: #fff; border: 1px solid #000; border-radius: 6px; padding: 2px 10px; box-shadow: 1px 1px 0 #000; }
:root[data-theme="classic"] button:hover { border-color: #000; background: #fff; }
:root[data-theme="classic"] button:active, :root[data-theme="classic"] button.on { background: #000; color: #fff; box-shadow: none; border-color: #000; }
:root[data-theme="classic"] input[type=search] { border: 1px solid #000; border-radius: 0; background: #fff; }
:root[data-theme="classic"] .side, :root[data-theme="classic"] .ed { border-color: #000; }
:root[data-theme="classic"] .side { border-right: 2px solid #000; }
:root[data-theme="classic"] .grp { color: #000; text-transform: none; letter-spacing: 0; font-weight: bold; padding: 12px 6px 3px; }
:root[data-theme="classic"] .grp::before { content: "\25B8 "; }
:root[data-theme="classic"] .f { border-radius: 0; }
:root[data-theme="classic"] .f:hover { background: #fff; text-decoration: underline; }
:root[data-theme="classic"] .f.act { background: #000; color: #fff; box-shadow: none; }
:root[data-theme="classic"] .f.act .d { color: #ccc; }
:root[data-theme="classic"] .root { border-top: 1px solid #000; color: #000; }
:root[data-theme="classic"] .tabs { background: #fff; border-bottom: 2px solid #000; padding: 6px 8px 0; gap: 4px; }
:root[data-theme="classic"] .tab { border: 1px solid #000; border-bottom: 0; border-radius: 6px 6px 0 0; background: #fff; padding: 3px 12px; margin-bottom: -2px; }
:root[data-theme="classic"] .tab.act { background: #fff; box-shadow: none; border-bottom: 2px solid #fff; font-weight: bold; }
:root[data-theme="classic"] .tab .dot { background: #000; border-radius: 0; }
:root[data-theme="classic"] .bar { border-bottom: 1px solid #000; background: #fff; }
:root[data-theme="classic"] .bar .sep { background: #000; }
:root[data-theme="classic"] textarea { font: 15px/1.9 "Monaco","Courier New",monospace; padding: 28px max(24px, calc((100% - 640px) / 2)); caret-color: #000; caret-shape: block; }
:root[data-theme="classic"] .prev { padding: 24px 32px 60px; }
:root[data-theme="classic"] .md { font-family: "Georgia","Palatino","Times New Roman",serif; font-size: 16px; line-height: 1.75; }
:root[data-theme="classic"] .md h1, :root[data-theme="classic"] .md h2 { font-family: "Geneva","Chicago",sans-serif; border-bottom: 2px solid #000; }
:root[data-theme="classic"] .md code, :root[data-theme="classic"] .md pre { background: #fff; border: 1px solid #000; border-radius: 0; font-family: "Monaco","Courier New",monospace; }
:root[data-theme="classic"] .md th { background: #000; color: #fff; }
:root[data-theme="classic"] .md th, :root[data-theme="classic"] .md td { border: 1px solid #000; }
:root[data-theme="classic"] .md blockquote { border-left: 4px solid #000; font-style: italic; }
:root[data-theme="classic"] .md .meta { background: #fff; border: 1px dashed #000; border-radius: 0; font-family: "Monaco",monospace; }
:root[data-theme="classic"] .md a { color: #000; text-decoration: underline; }
:root[data-theme="classic"] .md input[type=checkbox] { accent-color: #000; }
:root[data-theme="classic"] .status { border-top: 2px solid #000; background: #fff; color: #000; }
:root[data-theme="classic"] .ok, :root[data-theme="classic"] .bad { color: #000; }
:root[data-theme="classic"] ::-webkit-scrollbar { width: 16px; height: 16px; background: #fff; border-left: 1px solid #000; }
:root[data-theme="classic"] ::-webkit-scrollbar-thumb { background: #fff; border: 1px solid #000; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 3px #000; }
:root[data-theme="classic"] ::selection { background: #000; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <b>Journal</b><span style="color:var(--text-muted)">Am I Working</span>
    <span class="sp"></span>
    <a href="/">Tracker</a>
    <select id="theme" title="Theme" style="font:inherit;color:inherit;background:var(--tile);border:1px solid var(--border);border-radius:6px;padding:2px 6px">
      <option value="system">System</option><option value="classic">Classic Mac</option><option value="light">Light</option><option value="dark">Dark</option><option value="paper">Paper</option>
    </select>
  </div>
  <div class="body">
    <aside class="side">
      <div class="tools">
        <div class="row"><button id="today" title="Open or create today's page">Today</button><button id="newf">New file</button></div>
        <div class="row"><button id="imp" title="Bring in .md files from anywhere on this computer">Import .md</button></div>
        <input type="search" id="q" placeholder="Search files and text">
        <input type="file" id="file" accept=".md,.markdown,text/markdown,text/plain" multiple hidden>
      </div>
      <div class="tree" id="tree"></div>
      <div class="root" id="root"></div>
    </aside>
    <section class="main">
      <div class="tabs" id="tabs"></div>
      <div class="bar" id="bar">
        <button data-i="b" title="Bold"><b>B</b></button>
        <button data-i="i" title="Italic"><i>I</i></button>
        <button data-i="h" title="Heading">H</button>
        <button data-i="l" title="Bullet list">• List</button>
        <button data-i="t" title="Checkbox">☐ Task</button>
        <button data-i="c" title="Code">&lt;/&gt;</button>
        <span class="sep"></span>
        <button data-i="time" title="Insert time (Cmd/Ctrl+;)">Time</button>
        <button data-i="date" title="Insert date">Date</button>
        <button data-i="entry" title="Add a dated, timed entry at the end">+ Entry</button>
        <span class="sp"></span>
        <button data-m="edit">Edit</button><button data-m="split" class="on">Split</button><button data-m="view">Preview</button>
      </div>
      <div class="panes split" id="panes">
        <div class="ed"><textarea id="ta" spellcheck="true" placeholder="Start writing…"></textarea></div>
        <div class="prev"><div class="md" id="md"></div></div>
      </div>
    </section>
  </div>
  <div class="status">
    <span id="sPath">no file</span>
    <span id="sWords"></span>
    <span id="sTime"></span>
    <span class="sp"></span>
    <span id="sSave"></span>
    <span id="sNow"></span>
  </div>
</div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var HDR = { "x-amiw": "1", "Content-Type": "application/json" };
  var files = [], tabs = [], cur = null, mode = "split", saveTimer = null, query = "";
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function ymd(d) { return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate()); }
  function hm(d) { return p2(d.getHours()) + ":" + p2(d.getMinutes()); }
  function nice(d) { return DAYS[d.getDay()] + " " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  // ---------- markdown (small, safe: everything is escaped first) ----------
  function inline(s) {
    s = esc(s);
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/__([^_]+)__/g, "<b>$1</b>");
    s = s.replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g, "$1<i>$2</i>").replace(/(^|[^_\w])_([^_\s][^_]*)_/g, "$1<i>$2</i>");
    s = s.replace(/~~([^~]+)~~/g, "<s>$1</s>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
    return s.replace(/\u0000(\d+)\u0000/g, function (_, i) { return "<code>" + codes[+i] + "</code>"; });
  }
  function render(src) {
    var out = [], lines = src.replace(/\r\n?/g, "\n").split("\n"), i = 0, meta = "";
    if (lines[0] === "---") {
      var j = lines.indexOf("---", 1);
      if (j > 0) { meta = '<div class="meta">' + lines.slice(1, j).map(esc).join("<br>") + "</div>"; i = j + 1; }
    }
    function isBlockStart(l) { return /^(#{1,6}\s|```|>\s?|\s*([-*+]|\d+\.)\s|\s*[-*_]{3,}\s*$|\|)/.test(l); }
    var taskNo = 0;
    while (i < lines.length) {
      var l = lines[i], m;
      if (/^\s*$/.test(l)) { i++; continue; }
      if (/^```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
        i++; out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
      }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { out.push("<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"); i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
      if (/^>\s?/.test(l)) {
        var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) q.push(lines[i++].replace(/^>\s?/, ""));
        out.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>"); continue;
      }
      if (/^\|/.test(l) && i + 1 < lines.length && /^\|?\s*:?-{2,}/.test(lines[i + 1])) {
        var cells = function (r) { return r.replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); }); };
        var h = cells(l); i += 2; var rows = [];
        while (i < lines.length && /^\|/.test(lines[i])) rows.push(cells(lines[i++]));
        out.push("<table><thead><tr>" + h.map(function (c) { return "<th>" + inline(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>");
        continue;
      }
      if (/^\s*([-*+]|\d+\.)\s/.test(l)) {
        var items = [];
        while (i < lines.length && /^\s*([-*+]|\d+\.)\s/.test(lines[i])) {
          var mm = /^(\s*)([-*+]|\d+\.)\s+(.*)$/.exec(lines[i]);
          items.push({ d: Math.floor(mm[1].replace(/\t/g, "  ").length / 2), o: /\d/.test(mm[2]), t: mm[3], ln: i }); i++;
        }
        var html = "", stack = [];
        items.forEach(function (it) {
          while (stack.length && stack[stack.length - 1].d > it.d) html += "</li></" + stack.pop().tag + ">";
          var top = stack[stack.length - 1];
          if (!top || top.d < it.d) { var tag = it.o ? "ol" : "ul"; html += "<" + tag + ">"; stack.push({ d: it.d, tag: tag }); } else html += "</li>";
          var tk = /^\[( |x|X)\]\s+(.*)$/.exec(it.t);
          if (tk) { var dn = tk[1] !== " "; html += '<li class="task' + (dn ? " done" : "") + '"><input type="checkbox" data-ln="' + it.ln + '"' + (dn ? " checked" : "") + ">" + inline(tk[2]); }
          else html += "<li>" + inline(it.t);
        });
        while (stack.length) html += "</li></" + stack.pop().tag + ">";
        out.push(html); continue;
      }
      var para = [l]; i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !isBlockStart(lines[i])) para.push(lines[i++]);
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return meta + out.join("\n");
  }

  // ---------- api ----------
  function api(method, url, body) {
    return fetch(url, { method: method, headers: HDR, body: body ? JSON.stringify(body) : undefined }).then(function (r) {
      return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; });
    });
  }
  function loadList() {
    return api("GET", "/api/journal/files").then(function (r) {
      files = r.j.files || []; $("root").textContent = "Folder: " + (r.j.root || ""); drawTree();
    });
  }

  // ---------- tree ----------
  function drawTree() {
    var q = query.trim().toLowerCase(), groups = {}, order = [];
    files.slice().sort(function (a, b) { return b.mtime - a.mtime; }).forEach(function (f) {
      var inTabText = tabs.find(function (t) { return t.path === f.path; });
      if (q && f.path.toLowerCase().indexOf(q) < 0 && !(inTabText && inTabText.text.toLowerCase().indexOf(q) >= 0)) return;
      var g = f.path.indexOf("/") > 0 ? f.path.split("/").slice(0, -1).join("/") : "Journal";
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(f);
    });
    var h = "";
    order.forEach(function (g) {
      h += '<div class="grp">' + esc(g) + "</div>";
      groups[g].forEach(function (f) {
        var d = new Date(f.mtime);
        h += '<div class="f' + (cur && cur.path === f.path ? " act" : "") + '" data-p="' + esc(f.path) + '"><span class="n">' + esc(f.path.split("/").pop().replace(/\.md$/i, "")) +
          '</span><span class="d">' + d.getDate() + " " + MONTHS[d.getMonth()] + " " + hm(d) + "</span></div>";
      });
    });
    $("tree").innerHTML = h || '<div class="grp">No files match</div>';
  }
  $("tree").onclick = function (e) { var el = e.target.closest(".f"); if (el) openFile(el.getAttribute("data-p")); };
  $("q").oninput = function () { query = this.value; drawTree(); };

  // ---------- tabs ----------
  function drawTabs() {
    $("tabs").innerHTML = tabs.map(function (t) {
      return '<div class="tab' + (t === cur ? " act" : "") + (t.dirty ? " dirty" : "") + '" data-p="' + esc(t.path) + '"><span>' + esc(t.path.split("/").pop().replace(/\.md$/i, "")) +
        '</span><span class="dot"></span><span class="x" data-x="1" title="Close tab (the file stays on disk)">×</span></div>';
    }).join("");
  }
  $("tabs").onclick = function (e) {
    var el = e.target.closest(".tab"); if (!el) return;
    var t = tabs.find(function (x) { return x.path === el.getAttribute("data-p"); });
    if (e.target.getAttribute("data-x")) { closeTab(t); } else switchTo(t);
  };
  function closeTab(t) {
    if (t.dirty) saveNow(t);
    var i = tabs.indexOf(t); tabs.splice(i, 1);
    if (cur === t) switchTo(tabs[i] || tabs[i - 1] || null); else drawTabs();
  }
  function switchTo(t) {
    cur = t; drawTabs(); drawTree();
    $("ta").disabled = !t;
    if (!t) { $("ta").value = ""; $("md").innerHTML = '<div class="empty"><b>Nothing open</b>Pick a file on the left, or press Today.</div>'; status(); return; }
    $("ta").value = t.text; preview(); status();
  }
  function openFile(p) {
    var t = tabs.find(function (x) { return x.path === p; });
    if (t) return switchTo(t);
    return api("GET", "/api/journal/file?p=" + encodeURIComponent(p)).then(function (r) {
      if (!r.ok) return;
      t = { path: p, text: r.j.content, base: r.j.mtime, dirty: false, state: "saved" };
      tabs.push(t); switchTo(t);
    });
  }

  // ---------- editing and saving ----------
  function preview() { if (cur) $("md").innerHTML = render(cur.text); }
  $("ta").addEventListener("input", function () {
    if (!cur) return; cur.text = this.value; cur.dirty = true; cur.state = "typing";
    preview(); drawTabs(); status();
    clearTimeout(saveTimer); var t = cur; saveTimer = setTimeout(function () { saveNow(t); }, 700);
  });
  $("ta").addEventListener("keydown", function (e) {
    if (e.key === "Tab") { e.preventDefault(); insert("  "); }
    else if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); saveNow(cur); }
    else if ((e.metaKey || e.ctrlKey) && e.key === ";") { e.preventDefault(); insert(hm(new Date())); }
    else if ((e.metaKey || e.ctrlKey) && e.key === "b") { e.preventDefault(); wrap("**"); }
    else if ((e.metaKey || e.ctrlKey) && e.key === "i") { e.preventDefault(); wrap("*"); }
    else if (e.key === "Enter" && !e.shiftKey && !e.metaKey && !e.ctrlKey) {
      var ta = this, pos = ta.selectionStart, before = ta.value.slice(0, pos), line = before.slice(before.lastIndexOf("\n") + 1);
      var m = /^(\s*)([-*+]|\d+\.|- \[[ x]\])\s(.*)$/.exec(line);
      if (m) {
        e.preventDefault();
        if (!m[3]) { ta.setRangeText("", pos - line.length, pos, "end"); fire(); return; }
        var mark = /\d+\./.test(m[2]) ? (parseInt(m[2], 10) + 1) + "." : (/\[/.test(m[2]) ? "- [ ]" : m[2]);
        insert("\n" + m[1] + mark + " ");
      }
    }
  });
  function fire() { $("ta").dispatchEvent(new Event("input")); }
  function insert(s) { var ta = $("ta"); if (!cur) return; ta.focus(); ta.setRangeText(s, ta.selectionStart, ta.selectionEnd, "end"); fire(); }
  function wrap(m) {
    var ta = $("ta"); if (!cur) return; ta.focus();
    var a = ta.selectionStart, b = ta.selectionEnd, sel = ta.value.slice(a, b) || "text";
    ta.setRangeText(m + sel + m, a, b, "select"); ta.setSelectionRange(a + m.length, a + m.length + sel.length); fire();
  }
  function lineStart(prefix) {
    var ta = $("ta"); if (!cur) return; ta.focus();
    var a = ta.selectionStart, ls = ta.value.lastIndexOf("\n", a - 1) + 1;
    ta.setRangeText(prefix, ls, ls, "end"); fire();
  }
  function entry() {
    if (!cur) return; var d = new Date(), ta = $("ta"), v = ta.value;
    var add = (v && !/\n\n$/.test(v) ? (/\n$/.test(v) ? "\n" : "\n\n") : "") + "## " + nice(d) + " · " + hm(d) + "\n\n";
    ta.value = v + add; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); ta.scrollTop = ta.scrollHeight; fire();
  }
  $("bar").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    var m = b.getAttribute("data-m"), i = b.getAttribute("data-i");
    if (m) { setMode(m); return; }
    var d = new Date();
    if (i === "b") wrap("**"); else if (i === "i") wrap("*"); else if (i === "c") wrap("`");
    else if (i === "h") lineStart("## "); else if (i === "l") lineStart("- "); else if (i === "t") lineStart("- [ ] ");
    else if (i === "time") insert(hm(d)); else if (i === "date") insert(ymd(d)); else if (i === "entry") entry();
  };
  function setMode(m) {
    mode = m; $("panes").className = "panes " + m;
    [].forEach.call($("bar").querySelectorAll("[data-m]"), function (b) { b.className = b.getAttribute("data-m") === m ? "on" : ""; });
    try { localStorage.setItem("amiw-jmode", m); } catch (e) {}
  }
  // tick boxes in the preview: edits the source line
  $("md").addEventListener("change", function (e) {
    var el = e.target; if (!cur || el.type !== "checkbox") return;
    var ln = +el.getAttribute("data-ln"), off = cur.text.replace(/\r\n?/g, "\n").split("\n");
    var fm = off[0] === "---" ? off.indexOf("---", 1) + 1 : 0; // line numbers already count from the file start
    off[ln] = off[ln].replace(/\[( |x|X)\]/, el.checked ? "[x]" : "[ ]");
    $("ta").value = off.join("\n"); fire();
  });

  function saveNow(t) {
    if (!t || !t.dirty) return Promise.resolve();
    clearTimeout(saveTimer); t.state = "saving"; status();
    var body = { path: t.path, content: t.text, base: t.base, force: !!t.force };
    return api("PUT", "/api/journal/file", body).then(function (r) {
      if (r.ok) { t.dirty = false; t.state = "saved"; t.base = r.j.mtime; t.force = false; var f = files.find(function (x) { return x.path === t.path; }); if (f) f.mtime = r.j.mtime; else loadList(); }
      else if (r.status === 409) t.state = "conflict"; else t.state = "error";
      drawTabs(); status(); if (r.ok) drawTree();
    }).catch(function () { t.state = "error"; status(); });
  }
  window.addEventListener("beforeunload", function (e) { if (tabs.some(function (t) { return t.dirty; })) { tabs.forEach(function (t) { if (t.dirty) navigator.sendBeacon && 0; }); e.preventDefault(); e.returnValue = ""; } });

  // ---------- status bar ----------
  function status() {
    if (!cur) { $("sPath").textContent = "no file"; $("sWords").textContent = ""; $("sTime").textContent = ""; $("sSave").textContent = ""; return; }
    var w = (cur.text.trim().match(/\S+/g) || []).length;
    $("sPath").textContent = cur.path; $("sWords").textContent = w + " words · " + cur.text.split("\n").length + " lines";
    var f = files.find(function (x) { return x.path === cur.path; });
    $("sTime").textContent = f ? "updated " + nice(new Date(f.mtime)) + " " + hm(new Date(f.mtime)) : "";
    var s = $("sSave");
    if (cur.state === "saved") { s.className = "ok"; s.textContent = "saved to disk"; }
    else if (cur.state === "typing" || cur.state === "saving") { s.className = ""; s.textContent = "saving…"; }
    else if (cur.state === "conflict") { s.className = "bad"; s.innerHTML = 'changed on disk (edited elsewhere) <button id="keep">Keep mine</button> <button id="reload">Load theirs</button>'; }
    else { s.className = "bad"; s.textContent = "not saved, retrying on next edit"; }
  }
  $("sSave").onclick = function (e) {
    if (!cur) return;
    if (e.target.id === "keep") { cur.force = true; saveNow(cur); }
    else if (e.target.id === "reload") {
      api("GET", "/api/journal/file?p=" + encodeURIComponent(cur.path)).then(function (r) { cur.text = r.j.content; cur.base = r.j.mtime; cur.dirty = false; cur.state = "saved"; switchTo(cur); });
    }
  };
  setInterval(function () { var d = new Date(); $("sNow").textContent = nice(d) + " " + hm(d); }, 1000);
  var nd = new Date(); $("sNow").textContent = nice(nd) + " " + hm(nd);

  // ---------- today, new file, import ----------
  $("today").onclick = function () {
    var d = new Date(), name = "daily/" + ymd(d) + ".md";
    if (files.some(function (f) { return f.path === name; })) return openFile(name);
    var body = "---\ndate: " + ymd(d) + "\n---\n\n# " + nice(d) + "\n\n## " + hm(d) + "\n\n";
    api("PUT", "/api/journal/file", { path: name, content: body, createOnly: true }).then(function () { return loadList(); }).then(function () { return openFile(name); }).then(function () { $("ta").focus(); $("ta").setSelectionRange(body.length, body.length); });
  };
  $("newf").onclick = function () {
    var n = prompt("File name (inside your journal folder, e.g. ideas/startup):", "notes/untitled"); if (!n) return;
    n = n.trim().replace(/^\/+/, "").replace(/[^\w\-. \/]/g, "-").replace(/\.\.+/g, "."); if (!/\.md$/i.test(n)) n += ".md";
    if (files.some(function (f) { return f.path === n; })) return openFile(n);
    var title = n.split("/").pop().replace(/\.md$/i, ""), d = new Date();
    api("PUT", "/api/journal/file", { path: n, content: "# " + title + "\n\nCreated " + nice(d) + " " + hm(d) + "\n\n", createOnly: true }).then(function (r) {
      if (!r.ok) { alert("Could not create that file."); return; }
      return loadList().then(function () { return openFile(n); });
    });
  };
  $("imp").onclick = function () { $("file").click(); };
  $("file").onchange = function () {
    var list = [].slice.call(this.files), self = this, last;
    Promise.all(list.map(function (f) {
      return f.text().then(function (txt) {
        var nm = "imported/" + f.name.replace(/[^\w\-. ]/g, "-"); if (!/\.md$/i.test(nm)) nm = nm.replace(/\.[^.]*$/, "") + ".md";
        var base = nm.replace(/\.md$/i, ""), k = 1; while (files.some(function (x) { return x.path === nm; })) nm = base + "-" + (++k) + ".md"; // never overwrite
        last = nm; return api("PUT", "/api/journal/file", { path: nm, content: txt, createOnly: true });
      });
    })).then(function () { self.value = ""; return loadList(); }).then(function () { if (last) openFile(last); });
  };
  document.addEventListener("dragover", function (e) { e.preventDefault(); });
  document.addEventListener("drop", function (e) {
    e.preventDefault(); if (!e.dataTransfer.files.length) return;
    $("file").files = e.dataTransfer.files; $("file").onchange.call($("file"));
  });

  // ---------- theme (own key, default Classic) ----------
  var th = "system"; try { th = localStorage.getItem("amiw-jtheme") || "system"; } catch (e) {}
  $("theme").value = /^(light|dark|paper|classic|system)$/.test(th) ? th : "system";
  $("theme").onchange = function () {
    var v = this.value, r = document.documentElement;
    if (v === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", v);
    try { localStorage.setItem("amiw-jtheme", v); } catch (e) {}
  };

  try { var sm = localStorage.getItem("amiw-jmode"); if (sm) setMode(sm); } catch (e) {}
  switchTo(null);
  loadList().then(function () {
    var first = files.slice().sort(function (a, b) { return b.mtime - a.mtime; })[0];
    if (first) openFile(first.path);
  });
})();
</script>
</body>
</html>
