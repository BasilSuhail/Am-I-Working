<style>
:root {
  color-scheme: light;
  --surface-1: #fcfcfb; --tile: #eeeeeb; --border: #d6d5cf;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #7a7974;

}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-1: #0d1117; --tile: #1c2128; --border: #30363d;
    --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --green: #3fb950; --red: #f47067; --redbg: #3a1d20;
  }
}

  color-scheme: dark;
  --surface-1: #0d1117; --tile: #1c2128; --border: #30363d;
  --text-primary: #f0f3f6; --text-secondary: #c3c8cf; --text-muted: #8b949e;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --green: #3fb950; --red: #f47067; --redbg: #3a1d20;
}
:root[data-theme="paper"] {

}
* { box-sizing: border-box; }

.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }

.qb { color: var(--green); font-weight: 600; }

.empty { margin-top: 18px; color: var(--text-muted); font-size: 14px; }

.pop2 a { color: var(--s1); text-decoration: underline; overflow-wrap: anywhere; }
/* ---- left lists column ---- */
.page { display: block; }
.wrap { position: relative; }

}
.lc { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 14px; }

.lb { font: inherit; font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; }

.li { flex-wrap: wrap; }

.li { display: flex; align-items: center; gap: 9px; padding: 4px 0; }

.dayp .more { display: block; width: calc(100% - 16px); margin: 6px 8px; padding: 6px 8px; font: inherit; font-size: 12px; color: var(--text-muted); background: transparent; border: 1px dashed var(--border); border-radius: 8px; cursor: pointer; }
.dayp .more:hover { background: var(--tile); color: var(--text-primary); }
.pop2 { position: fixed; z-index: 30; width: 300px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.45); font-size: 14px; overflow: hidden; display: none; }

.pop2 .p1 b { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.pop2 .src2 { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; color: var(--text-secondary); max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
.pop2 .loc { padding: 0 16px 12px; color: var(--text-muted); overflow-wrap: anywhere; }
.pop2 .rows { border-top: 1px solid var(--border); padding: 10px 16px; line-height: 1.7; overflow-wrap: anywhere; white-space: pre-wrap; }
.pop2 .rows.m { color: var(--text-muted); }

/* ---- settings ---- */
.set { position: fixed; z-index: 40; width: 340px; max-height: calc(100vh - 90px); overflow-y: auto; background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 40px rgba(0,0,0,.45); padding: 14px 16px 16px; display: none; font-size: 14px; }
.set h3 { margin: 0 0 12px; font-size: 15px; }
.set .sec { margin-bottom: 16px; }
.set .lab { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
.set .th { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.set button { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; }
.set button:hover { background: var(--tile); color: var(--text-primary); }
.set .th button { display: flex; align-items: center; gap: 7px; }
.set .th button[aria-pressed="true"] { border-color: var(--green); color: var(--text-primary); }
.set .sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--border); flex: none; }
.set input { width: 100%; font: inherit; font-size: 13px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--tile); color: var(--text-primary); margin-bottom: 6px; }
.set .row { display: flex; gap: 6px; align-items: center; }
.set .calrow { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
.set .calrow:first-of-type { border-top: 0; }
.set .calrow .nm { flex: 1; min-width: 0; }
.set .calrow .nm b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.set .sst { font-size: 12px; color: var(--text-muted); }
.set .sst.bad { color: var(--red); }
.set .sst.ok { color: var(--green); }
.set .hint { font-size: 12px; color: var(--text-muted); line-height: 1.5; margin: 6px 0 0; }
.set .go { color: var(--text-primary); border-color: var(--green); }
</style>
</head>
<body>
<div class="page">
<aside class="side" id="side" aria-label="Lists"></aside>
<div class="wrap">
  <div class="tools"><button class="rbtn" id="gearBtn" type="button" title="Settings" aria-label="Settings" aria-haspopup="dialog"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button><button class="rbtn" id="refreshBtn" type="button" title="Reload everything, ask GitHub and re-read your calendars">Refresh</button></div>
  <h1>Daily record</h1>

  <div class="chart-scroll" id="chartScroll">
    <div class="chart">
      <div class="months" id="months"></div>
      <div class="body">
        <div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div>
        <div class="grid" id="grid" role="group" aria-label="Activity grid, 20 weeks. Press a day to see just that day."></div>
      </div>
    </div>
  </div>
  <div class="legend">
    <span class="item"><i class="dot" style="background:var(--s1)"></i>Commits (top bar)</span>
    <span class="item"><i class="dot" style="background:var(--s2)"></i>Skool (middle bar)</span>
    <span class="item"><i class="dot" style="background:var(--s3)"></i>Wins (bottom bar)</span>
    <span>Click a day to see just that day. Click it again to go back.</span>
  </div>

  <section class="feed" aria-label="Win log">
    <div class="searchbar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="Search, or type a win and press Enter" aria-label="Search the log, or type a win and press Enter to add it">
      <span id="count" class="count"></span>
      <span class="skoolctl" id="stats"></span>
    </div>
    <div id="feedList"></div>
  </section>

  <p class="note" id="savestate" role="status">Loading</p>
<aside class="cal" id="cal" aria-label="Calendar"></aside>
</div>
</div>
<div class="sr" id="live" role="status" aria-live="polite"></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button class="bt" id="toastUndo">Undo</button></div>
<div class="tip" id="tip"></div>

<script>
(function () {
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var rand = rng(2611);
  var WEEKS = 20, DAYS = WEEKS * 7, todayI = DAYS - 1;
  var nowD = new Date(), end = Date.UTC(nowD.getFullYear(), nowD.getMonth(), nowD.getDate()), start = end - (DAYS - 1) * 864e5;
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var WD = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function fmt(d) { return WD[(d.getUTCDay() + 6) % 7] + " " + d.getUTCDate() + " " + MON[d.getUTCMonth()]; }
  function hhmm() { return new Date().toTimeString().slice(0, 5); }

  var base = [];
  for (var i = 0; i < DAYS; i++) base.push({ d: new Date(start + i * 864e5), c0: 0, s0: 0, w0: 0 });
  var nid = 1, entries = [], overrides = {}, skoolC = base.map(function (b) { return b.s0; });
  var sel = null, flt = "all", editing = null, openId = null, menuFor = null, clubFrom = null, confirmDel = null, undoSnap = null, toastT = null;
  function mk(day, text, time) { return { id: nid++, kind: "win", day: day, text: text, time: time, parent: null }; }
  var data = base.map(function (x) { return { d: x.d, commits: x.c0, skool: 0, wins: 0 }; });
  function qty(e) { var n = Math.floor(Number(e.n)); return n >= 1 ? Math.min(n, 99) : 1; }
  function recompute() {
    data.forEach(function (x, i) { x.commits = overrides[i] !== undefined ? overrides[i] : base[i].c0; x.skool = skoolC[i]; x.wins = 0; });
    entries.forEach(function (e) { data[e.day].wins += qty(e); });
    // bar scale follows the data: the biggest day of each row is always the full bar
    KEYS.forEach(function (k) { CAPS[k] = Math.max(FLOOR[k], data.reduce(function (m, x) { return Math.max(m, x[k]); }, 0)); });
  }
  function tgt() { return sel === null ? todayI : sel; }
  function byId(id) { for (var i = 0; i < entries.length; i++) if (entries[i].id === id) return entries[i]; return null; }
  function kidsOf(id) { return entries.filter(function (e) { return e.parent === id; }); }
  function snap() { return JSON.stringify({ e: entries, o: overrides, n: nid, s: skoolC }); }
  function restore(s) { var o = JSON.parse(s); entries = o.e; overrides = o.o; nid = o.n; skoolC = o.s; afterChange(); }

  // grid
  var cells = [], grid = document.getElementById("grid"), tip = document.getElementById("tip");
  var KEYS = ["commits", "skool", "wins"], FLOOR = { commits: 1, skool: 1, wins: 2 }, CAPS = { commits: 1, skool: 1, wins: 1 }, CL = ["a", "b", "c"];
  function paint(i) {
    var x = data[i], c = cells[i], f = c.querySelectorAll(".fill");
    c.className = "cell" + (i === todayI ? " today" : "") + (i === sel ? " sel" : "");
    c.setAttribute("aria-label", fmt(x.d) + ": " + x.commits + " commits, " + x.skool + " Skool, " + x.wins + " wins" + (i === sel ? ", selected" : ""));
    c.setAttribute("aria-pressed", String(i === sel));
    for (var k = 0; k < 3; k++) { var v = x[KEYS[k]]; f[k].style.width = v ? Math.max(16, Math.min(100, v / CAPS[KEYS[k]] * 100)) + "%" : "0%"; }
  }
  base.forEach(function (b, i) {
    var c = document.createElement("div"); c.tabIndex = 0; c.setAttribute("role", "button");
    CL.forEach(function (cl) { var lane = document.createElement("div"); lane.className = "lane"; var f = document.createElement("div"); f.className = "fill " + cl; lane.appendChild(f); c.appendChild(lane); });
    function show() {
      var r = c.getBoundingClientRect(), x = data[i];
      tip.innerHTML = "<b>" + fmt(x.d) + (i === todayI ? " (today)" : "") + "</b>" +
        '<div><i class="dot" style="background:var(--s1)"></i>' + x.commits + " commits</div>" +
        '<div><i class="dot" style="background:var(--s2)"></i>' + x.skool + " Skool</div>" +
        '<div><i class="dot" style="background:var(--s3)"></i>' + x.wins + " wins</div>";
      tip.style.display = "block";
      tip.style.left = Math.max(8, Math.min(r.left, window.innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = (r.top - tip.offsetHeight - 8 < 8 ? r.bottom + 8 : r.top - tip.offsetHeight - 8) + "px";
    }
    function hide() { tip.style.display = "none"; }
    c.addEventListener("pointerenter", show); c.addEventListener("pointerleave", hide);
    c.addEventListener("focus", show); c.addEventListener("blur", hide);
    function pick() { sel = sel === i ? null : i; clubFrom = null; confirmDel = null; editing = null; afterChange(); }
    c.addEventListener("click", pick);
    c.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); } });
    cells.push(c); grid.appendChild(c);
  });
  var months = document.getElementById("months"), lastM = -1;
  for (var wk = 0; wk < WEEKS; wk++) {
    var md = new Date(start + wk * 7 * 864e5);
    if (md.getUTCMonth() !== lastM) { var sp = document.createElement("span"); sp.textContent = MON[md.getUTCMonth()]; sp.style.left = (wk / WEEKS * 100) + "%"; months.appendChild(sp); lastM = md.getUTCMonth(); }
  }

  // stat boxes: only the Skool box changes numbers; the Commits box switches the list to commit days
  function sum(k) { return data.slice(-7).reduce(function (t, x) { return t + x[k]; }, 0); }
  function daysWith(k) { return data.slice(-7).filter(function (x) { return x[k] > 0; }).length; }
  function dayWord() { return sel === null ? "Today" : data[sel].d.getUTCDate() + " " + MON[data[sel].d.getUTCMonth()]; }
  function ctl(kind) {
    var v = data[tgt()][kind], w = esc(dayWord());
    if (kind !== "skool") return '<div class="td">' + w + ' <b>' + v + '</b></div>';
    return '<div class="ctl"><span class="td">' + w + ' <b>' + v + '</b></span>' +
      '<button class="mini" data-act="step" data-d="-1" aria-label="Remove one Skool on ' + w + '"' + (v === 0 ? " disabled" : "") + '>&minus;</button>' +
      '<button class="mini" data-act="step" data-d="1" aria-label="Add one Skool on ' + w + '">+</button></div>';
  }
  function box(f, cls, color, n, label, right, clickable) {
    var attrs = clickable ? ' data-filter="' + f + '" tabindex="0" role="button" aria-pressed="' + (flt === f) + '" aria-label="' + label + ', press to show commits per day"' : "";
    return '<div class="stat ' + cls + (clickable ? " clickable" : "") + (clickable && flt === f ? " active" : "") + '"' + attrs + '><div class="info"><div class="n">' + n + '</div><div class="l"><i class="dot" style="background:var(' + color + ')"></i>' + label + '</div></div>' + right + '</div>';
  }
  function renderStats() {
    var v = data[tgt()]["skool"], w = esc(dayWord());
    document.getElementById("stats").innerHTML = '<i class="dot" style="background:var(--s2)"></i><span class="td">Skool ' + w + ' <b>' + v + '</b></span>' +
      '<button class="mini" data-act="step" data-d="-1" aria-label="Remove one Skool on ' + w + '"' + (v === 0 ? " disabled" : "") + '>&minus;</button>' +
      '<button class="mini" data-act="step" data-d="1" aria-label="Add one Skool on ' + w + '">+</button>';
  }

  // activity list (wins only)
  var ICON_MOVE = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1l3.2 3.6H9V6.2H7V4.6H4.8zM8 15l-3.2-3.6H7V9.8h2v1.6h2.2zM1.5 7.2h1.7v1.6H1.5zm3.4 0h1.7v1.6H4.9zm3.4 0H10v1.6H8.3zm3.4 0h1.7v1.6h-1.7z"/></svg>';
  // rich notes: stored as sanitized HTML (whitelist), so pasted or tampered content cannot run anything
  var DEFAULT_H = 160, ALLOW = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, UL: 1, OL: 1, LI: 1, BR: 1, DIV: 1, P: 1, H3: 1 };
  function cleanInto(node, out) {
    node.childNodes.forEach(function (c) {
      if (c.nodeType === 3) out.appendChild(document.createTextNode(c.nodeValue));
      else if (c.nodeType === 1) {
        var t = c.tagName; if (t === "SCRIPT" || t === "STYLE") return;
        if (ALLOW[t]) {
          var n = document.createElement(t.toLowerCase());
          if (t === "UL" && c.classList.contains("todo")) n.className = "todo";
          if (t === "OL") { var st = parseInt(c.getAttribute("start"), 10); if (st > 1 && st < 10000) n.setAttribute("start", String(st)); }
          if (t === "LI" && c.getAttribute("data-done") === "1") n.setAttribute("data-done", "1");
          cleanInto(c, n);
          // a list sitting straight inside a list is not valid: tuck it into the item above so it nests properly
          var host = out;
          if ((t === "UL" || t === "OL") && (out.tagName === "UL" || out.tagName === "OL")) {
            host = out.lastElementChild && out.lastElementChild.tagName === "LI" ? out.lastElementChild : out.appendChild(document.createElement("li"));
          }
          host.appendChild(n);
        } else cleanInto(c, out);
      }
    });
  }
  function sanitize(html) { var d = new DOMParser().parseFromString("<body>" + html + "</body>", "text/html"), o = document.createElement("div"); cleanInto(d.body, o); return o.innerHTML; }
  function noteHtml(e) { var n = e.note || ""; return e.rich ? sanitize(n) : esc(n).replace(/\n/g, "<br>"); }
  function notePlain(e) { var n = e.note || ""; return e.rich ? n.replace(/<[^>]*>/g, " ").replace(/&nbsp;/g, " ") : n; }
  function hasNote(e) { return notePlain(e).trim().length > 0; }
  function matches(e, q) { var d = base[e.day].d; return !q || (fmt(d) + " " + FULL[d.getUTCMonth()] + " " + e.text + " " + notePlain(e)).toLowerCase().indexOf(q) !== -1; }
  function inDay(e) { return sel === null || e.day === sel || kidsOf(e.id).some(function (k) { return k.day === sel; }); }
  function visibleTop(q) { return entries.filter(function (e) { return !e.parent && inDay(e) && (matches(e, q) || kidsOf(e.id).some(function (k) { return matches(k, q); })); }); }
  function fullDate(d) { return ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getUTCDay()] + " " + d.getUTCDate() + " " + FULL[d.getUTCMonth()] + " " + d.getUTCFullYear(); }
  function isoDay(i) { return base[i].d.toISOString().slice(0, 10); }
  function menuHtml(e) {
    return '<div class="menu" role="group" aria-label="Move options"><button class="bt" data-act="up" data-id="' + e.id + '">Move up</button><button class="bt" data-act="down" data-id="' + e.id + '">Move down</button>' +
      '<label>Move to day <input type="date" class="dateIn" data-id="' + e.id + '" min="' + isoDay(0) + '" max="' + isoDay(DAYS - 1) + '" value="' + isoDay(e.day) + '"></label>' +
      (e.parent ? '<button class="bt" data-act="unclub" data-id="' + e.id + '">Take out of the win</button>' : '<button class="bt" data-act="club" data-id="' + e.id + '">Club into another win</button>') +
      '<button class="bt" data-act="closemenu">Close</button></div>';
  }
  function row(e, pickable) {
    var kids = e.parent ? [] : kidsOf(e.id), line;
    if (editing === e.id) {
      line = '<input class="editin" data-edit="' + e.id + '" value="' + esc(e.text) + '" maxlength="140" aria-label="Edit the win, Enter to save, Escape to cancel"><label class="qtyl">&times;<input type="number" class="qtyin" min="1" max="99" value="' + qty(e) + '" aria-label="How many this win counts for"></label>' +
        '<span class="btns"><button class="bt ok" data-act="save" data-id="' + e.id + '">Save</button><button class="bt no" data-act="ask" data-id="' + e.id + '">Delete</button>' + (e.back ? '<button class="bt" data-act="back" data-id="' + e.id + '">Back on list</button>' : "") + '<button class="bt" data-act="canceledit">Cancel</button></span>' +
        (confirmDel === e.id ? '<div class="confirm" role="alertdialog" aria-label="Confirm delete"><span>Delete this win?</span><button class="bt no solid" data-act="del" data-id="' + e.id + '">Yes, delete</button><button class="bt" data-act="cancel">Cancel</button></div>' : "");
    } else {
      line = '<span class="t"' + (pickable ? "" : ' data-act="open" data-id="' + e.id + '" tabindex="0" role="button" aria-expanded="' + (openId === e.id) + '" title="Click to open the notes" style="cursor:pointer"') + '>' + esc(e.text) + (qty(e) > 1 ? ' <b class="qb">&times;' + qty(e) + '</b>' : "") + (hasNote(e) ? ' <span class="nt">notes</span>' : "") + '</span><span class="m">' + (e.parent ? esc(fmt(base[e.day].d)) : (e.time || "")) + '</span>' +
        (kids.length ? '<span class="note2">clubbed, counts as ' + (kids.reduce(function (t, k) { return t + qty(k); }, qty(e))) + ' wins</span>' : "") +
        '<span class="btns"><button class="bt ok" data-act="edit" data-id="' + e.id + '">Edit</button>' +
        '<button class="bt mv" draggable="true" data-act="menu" data-id="' + e.id + '" aria-label="Move this win. Drag it, or press for options" title="Drag to move, or press for options">' + ICON_MOVE + '</button></span>';
    }
    return '<div class="rw"><div class="tr" data-id="' + e.id + '"' + (pickable ? ' data-act="clubto" tabindex="0" role="button" style="cursor:pointer"' : "") + '>' + line + '</div>' +
      (menuFor === e.id ? menuHtml(e) : "") +
      (openId === e.id && editing !== e.id ? '<div class="detail"><div class="tb" role="toolbar" aria-label="Formatting">' +
        '<button type="button" class="tbb" data-cmd="bold" title="Bold (Ctrl+B)" aria-label="Bold"><b>B</b></button>' +
        '<button type="button" class="tbb" data-cmd="italic" title="Italic (Ctrl+I)" aria-label="Italic"><i>I</i></button>' +
        '<button type="button" class="tbb" data-cmd="underline" title="Underline (Ctrl+U)" aria-label="Underline"><u>U</u></button>' +
        '<button type="button" class="tbb" data-cmd="h" title="Heading" aria-label="Heading">H</button>' +
        '<span class="sep"></span>' +
        '<button type="button" class="tbb" data-cmd="ul" title="Bullet points" aria-label="Bullet list">&bull;&nbsp;List</button>' +
        '<button type="button" class="tbb" data-cmd="ol" title="Numbered list" aria-label="Numbered list">1.&nbsp;List</button>' +
        '<button type="button" class="tbb" data-cmd="todo" title="Checklist" aria-label="Checklist">&#9745;&nbsp;Check</button></div>' +
        '<div class="ned" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Notes for this win" data-id="' + e.id + '" data-ph="Notes, description, details. Saves as you type. Drag the corner to resize, only this win remembers the size." style="height:' + (e.nh || DEFAULT_H) + 'px">' + noteHtml(e) + '</div></div>' : "") +
      (kids.length ? '<div class="kids">' + kids.map(function (k) { return row(k, false); }).join("") + '</div>' : "") + '</div>';
  }
  function commitGroup(i) {

        put(iso(ds.getFullYear(), ds.getMonth(), ds.getDate()), { ev: ev, allDay: false, s: Math.round((a - ds) / 60000), e: Math.round((b - ds) / 60000), startMs: s.getTime(), endMs: e.getTime() });
      }
    });
    return out;
  }

  // ---- month grid ----
  var days = {};
  function draw() {
    days = byDay();
    var y = view.y, m = view.m, n = new Date(y, m + 1, 0).getDate(), lead = (new Date(y, m, 1).getDay() + 6) % 7, today = iso(now0.getFullYear(), now0.getMonth(), now0.getDate());
    var o = '<div class="ttl"><button type="button" id="cp" aria-label="Previous month">&lsaquo;</button><span>' + MN[m] + " " + y + '</span><button type="button" id="cn" aria-label="Next month">&rsaquo;</button></div><div class="wh">';
    ["M", "T", "W", "T", "F", "S", "S"].forEach(function (x) { o += "<span>" + x + "</span>"; });
    o += '</div><div class="cg">';
    for (var i = 0; i < lead; i++) o += '<div class="c off"></div>';
    for (var d = 1; d <= n; d++) {
      var k = iso(y, m, d), list = days[k] || [], per = {};
      list.forEach(function (x) { per[x.ev.cal] = (per[x.ev.cal] || 0) + 1; });
      var bars = sources.filter(function (s) { return per[s.id]; }).slice(0, 2).map(function (s) { return '<i style="background:' + esc(s.color) + ";width:" + Math.min(100, per[s.id] * 50) + '%"></i>'; }).join("");
      var cls = "c" + (k === today ? " today" : "") + (sel.y === y && sel.m === m && sel.d === d ? " sel" : "");
      o += '<button type="button" class="' + cls + '" data-d="' + d + '" aria-label="' + d + " " + MN[m] + (list.length ? ", " + list.length + " events" : "") + '"><span>' + d + '</span><span class="bars">' + bars + "</span></button>";
    }
    o += '</div><div class="dayp" id="dayp"></div>';
    root.innerHTML = o;
    root.querySelector("#cp").onclick = function () { view.m--; if (view.m < 0) { view.m = 11; view.y--; } pickFirst(); load(); };
    root.querySelector("#cn").onclick = function () { view.m++; if (view.m > 11) { view.m = 0; view.y++; } pickFirst(); load(); };
    root.querySelectorAll(".c[data-d]").forEach(function (c) {
      c.addEventListener("click", function () { sel = { y: y, m: m, d: +c.dataset.d }; root.querySelectorAll(".c.sel").forEach(function (x) { x.classList.remove("sel"); }); c.classList.add("sel"); renderDay(); });
      c.addEventListener("mousemove", function (q) {
        var k2 = iso(y, m, +c.dataset.d), list2 = days[k2] || [], per2 = {};
        list2.forEach(function (x) { per2[x.ev.cal] = (per2[x.ev.cal] || 0) + 1; });
        var t = "<b>" + WD[new Date(y, m, +c.dataset.d).getDay()] + " " + c.dataset.d + " " + MN[m].slice(0, 3) + "</b>";
        var rows = sources.filter(function (s) { return per2[s.id]; }).map(function (s) { return '<div><i class="dot" style="background:' + esc(s.color) + '"></i>' + per2[s.id] + " " + esc(s.name) + "</div>"; }).join("");
        tip.innerHTML = t + (rows || "<div>No events</div>"); tip.style.display = "block";
        tip.style.left = Math.max(8, q.clientX - tip.offsetWidth - 16) + "px"; tip.style.top = (q.clientY + 14) + "px";
      });
      c.addEventListener("mouseleave", function () { tip.style.display = "none"; });
    });
    fit(); renderDay();
  }
  function pickFirst() { sel = { y: view.y, m: view.m, d: (view.y === now0.getFullYear() && view.m === now0.getMonth()) ? now0.getDate() : 1 }; }
  // tiles are exactly the chart's tiles (set by styling, this only removes sub-pixel drift)
  function fit() {
    var c = document.querySelector("#grid .cell"); if (!c) return;
    var w = c.getBoundingClientRect().width; if (w > 0) root.style.setProperty("--cw", w + "px");
  }

  // ---- one day ----
  function renderDay() {
    var el = document.getElementById("dayp"); if (!el) return;
    var key = iso(sel.y, sel.m, sel.d); if (key !== lastKey) { exTop = false; lastKey = key; }
    var list = days[key] || [], ad = list.filter(function (x) { return x.allDay; }), L = list.filter(function (x) { return !x.allDay; }).sort(function (a, b) { return a.s - b.s; });
    var w = WD[new Date(sel.y, sel.m, sel.d).getDay()], total = list.length;
    var o = '<div class="dh"><b>' + w + " " + sel.d + " " + MN[sel.m].slice(0, 3) + "</b><span>" + total + " event" + (total === 1 ? "" : "s") + "</span></div>";
    if (!sources.length) o += '<div class="none">No calendars yet. Open the gear (top right) to add a calendar link.</div>';
    else if (!total) o += '<div class="none">Nothing on this day.</div>';
    if (ad.length) { o += '<div class="ad">'; ad.forEach(function (x, i) { o += '<div class="chip" data-ad="' + i + '" tabindex="0" style="background:' + esc(colorOf(x.ev.cal)) + '38;border-color:' + esc(colorOf(x.ev.cal)) + '">' + esc(x.ev.title) + "</div>"; }); o += "</div>"; }
    var cols = [], H1 = 24, H0 = 7;
    if (L.length) {
      L.forEach(function (x) { var k = 0; while (cols[k] && cols[k] > x.s) k++; x.k = k; cols[k] = x.e; });
      L.forEach(function (x) { var n = 1; L.forEach(function (y2) { if (y2.s < x.e && x.s < y2.e) n = Math.max(n, y2.k + 1); }); x.n = n; });
      var lo0 = Math.min(7, Math.floor(L[0].s / 60)); H0 = exTop ? 0 : lo0;
      var nm2 = function (h3) { return h3 === 0 ? "12 am" : h3 === 12 ? "Midday" : (h3 % 12 || 12) + (h3 < 12 ? " am" : " pm"); }, PH = 44;
      o += '<div class="sc">';
      if (H0 > 0) o += '<button class="more" type="button" data-more="1">Earlier hours: 12 am to ' + nm2(H0) + "</button>";
      else if (lo0 > 0) o += '<button class="more" type="button" data-more="1">Hide earlier hours</button>';
      o += '<div class="tl" style="height:' + ((H1 - H0) * PH) + 'px">';
      for (var h2 = H0; h2 <= H1; h2++) { var t = (h2 - H0) * PH; o += '<div class="hr" style="top:' + t + 'px"></div>' + (h2 < H1 ? '<div class="hl" style="top:' + (t + (h2 === H0 ? 8 : 0)) + 'px">' + (h2 === 0 ? "Midnight" : nm2(h2)) + "</div>" : ""); }
      if (key === iso(now0.getFullYear(), now0.getMonth(), now0.getDate())) { var nw = new Date(), mins = nw.getHours() * 60 + nw.getMinutes(); if (mins >= H0 * 60) o += '<div class="now" style="top:' + ((mins - H0 * 60) / 60 * PH) + 'px"></div>'; }
      L.forEach(function (x, i) {
        var top = (x.s - H0 * 60) / 60 * PH, ht = Math.max(22, (x.e - x.s) / 60 * PH - 2), wid = 100 / x.n, c = colorOf(x.ev.cal);
        o += '<div class="eb" data-i="' + i + '" tabindex="0" style="background:' + esc(c) + "38;border-color:" + esc(c) + ";top:" + top + "px;height:" + ht + "px;left:calc(" + (x.k * wid) + "% + 2px);width:calc(" + wid + '% - 4px)"><b>' + esc(x.ev.title) + "</b><small>" + hm(x.s) + " to " + hm(x.e) + "</small></div>";
      });
      o += "</div></div>";
    }
    el.innerHTML = o;
    var more = el.querySelector(".more"); if (more) more.onclick = function () { exTop = !exTop; renderDay(); };
    function bind(node, x, when) { var open = function () { showPop(node, x, when); }; node.addEventListener("click", function (e) { e.stopPropagation(); open(); }); node.addEventListener("keydown", function (e) { if (e.key === "Enter") open(); }); }
    el.querySelectorAll(".chip").forEach(function (n) { var x = ad[+n.dataset.ad]; bind(n, x, "All day"); });
    el.querySelectorAll(".eb").forEach(function (n) { var x = L[+n.dataset.i]; bind(n, x, clock(x.startMs) + " to " + clock(x.endMs)); });
  }
  var pop = document.createElement("div"); pop.className = "pop2"; document.body.appendChild(pop);
  // text with clickable web links: escape first, then wrap only http(s) addresses
  function linkify(t) {
    return esc(t).replace(/https?:\/\/[^\s<]+/g, function (u) {
      var tail = (u.match(/[.,;:!?)\]]+$/) || [""])[0]; if (tail) u = u.slice(0, -tail.length);
      return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + "</a>" + tail;
    });
  }
  function showPop(anchor, x, when) {
    var ev = x.ev, c = colorOf(ev.cal), dt = new Date(sel.y, sel.m, sel.d);
    pop.innerHTML = '<div class="p1"><b>' + esc(ev.title) + '</b><span class="src2"><i class="dot" style="background:' + esc(c) + '"></i>' + esc(nameOf(ev.cal)) + "</span></div>" +
      '<div class="loc">' + (ev.loc ? linkify(ev.loc) : "No location") + "</div>" +
      '<div class="rows">' + esc(WD[dt.getDay()] + " " + dt.getDate() + " " + MN[dt.getMonth()].slice(0, 3) + " " + dt.getFullYear()) + "\n" + esc(when) + (ev.rep ? "\nRepeats" : "") + "</div>" +
      '<div class="rows m">' + (ev.notes ? linkify(ev.notes.slice(0, 600)) : "No notes") + "</div>";
    pop.style.display = "block";
    var r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, left = r.left - w - 12;
    if (left < 8) left = Math.min(innerWidth - w - 8, r.right + 12);
    pop.style.left = left + "px"; pop.style.top = Math.min(Math.max(8, r.top), Math.max(8, innerHeight - h - 8)) + "px";
  }
  document.addEventListener("click", function (e) { if (!pop.contains(e.target)) pop.style.display = "none"; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") pop.style.display = "none"; });

  // ---- sync (the Refresh button also re-reads the calendars) ----
  function syncNow() {
    paintSync("busy", "Syncing");
    return fetch("/api/sync", { method: "POST", headers: H }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (j) {
      settings = j.settings || settings; sources = settings.calendars || []; stateFrom(settings);
      if (j.ok) { refresh.classList.add("flash"); setTimeout(function () { refresh.classList.remove("flash"); }, 1000); }
      return load();
    }).catch(function () { paintSync("bad", "Could not reach the server."); });
  }
  refresh.addEventListener("click", function () { syncNow(); });
  setInterval(function () { if (document.visibilityState === "visible" && !settingsOpen()) load(); }, 60000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
  window.addEventListener("resize", fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.getElementById("grid"));

  // ---- settings ----
  var gear = document.getElementById("gearBtn"), box = document.createElement("div");
  box.className = "set"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Settings"); document.body.appendChild(box);
  function settingsOpen() { return box.style.display === "block"; }
  var TH = [["system", "System", "linear-gradient(90deg,#fcfcfb 50%,#0d1117 50%)"], ["light", "Light", "#fcfcfb"], ["dark", "Dark", "#0d1117"], ["paper", "Paper", "#f6efd9"]];
  var COLORS = ["#4285f4", "#e8554e", "#1baf7a", "#f5a623", "#9b59d0", "#16a2b8", "#e6628f", "#8a8f98"], pickColor = 0, note = "";
  function curTheme() { try { var t = localStorage.getItem("amiw-theme"); return (t === "light" || t === "dark" || t === "paper") ? t : "system"; } catch (e) { return "system"; } }
  function setTheme(t) { var r = document.documentElement; if (t === "system") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", t); try { if (t === "system") localStorage.removeItem("amiw-theme"); else localStorage.setItem("amiw-theme", t); } catch (e) {} }
  function when(ms) { return ms ? clock(ms) : "never"; }
  function render() {
    var g = settings.github || {}, c = curTheme();
    var o = "<h3>Settings</h3>";
    o += '<div class="sec"><div class="lab">Theme</div><div class="th">' + TH.map(function (t) { return '<button type="button" data-t="' + t[0] + '" aria-pressed="' + (t[0] === c) + '"><i class="sw" style="background:' + t[2] + '"></i>' + t[1] + "</button>"; }).join("") + "</div></div>";
    o += '<div class="sec"><div class="lab">GitHub commits</div><input id="ghl" type="text" placeholder="GitHub username" autocomplete="off" spellcheck="false" value="' + esc(g.login || "") + '">';
    o += '<input id="ght" type="password" placeholder="' + (g.hasToken ? "Token saved. Paste a new one to replace it" : "Read-only token (starts with ghp_ or github_pat_)") + '" autocomplete="off" spellcheck="false">';
    o += '<div class="row"><button type="button" id="ghs" class="go">Save</button>' + (g.hasToken && !g.fromEnv ? '<button type="button" id="ghc">Remove token</button>' : "") + "</div>";
    o += '<p class="hint ' + (g.hasToken ? (g.ok === false ? "sst bad" : g.ok ? "sst ok" : "") : "") + '">' + (g.hasToken ? (g.ok === false ? esc(g.error || "GitHub did not accept it.") : g.ok ? "Connected. Last checked " + when(g.at) + "." : (g.fromEnv ? "Token comes from the server settings." : "Saved. Not checked yet.")) : "Fills the blue bars in the chart. The token stays on your computer and is never shown again.") + "</p></div>";
    o += '<div class="sec"><div class="lab">Calendars</div>';
    if (!sources.length) o += '<p class="hint" style="margin:0 0 6px">None yet.</p>';
    sources.forEach(function (s) {
      var st = s.ok === false ? '<span class="sst bad">' + esc(s.error || "Could not read it") + "</span>" : s.ok ? '<span class="sst ok">Synced ' + when(s.at) + " · " + s.count + " events</span>" : '<span class="sst">Not synced yet</span>';
      o += '<div class="calrow"><i class="dot" style="background:' + esc(s.color) + '"></i><div class="nm"><b>' + esc(s.name) + "</b>" + st + '</div><button type="button" data-rm="' + esc(s.id) + '">Remove</button></div>';
    });
    o += '<div style="margin-top:8px"><input id="cn1" type="text" placeholder="Name, for example Google" maxlength="60" autocomplete="off"><input id="cl1" type="url" placeholder="Calendar link (https:// or webcal://)" autocomplete="off" spellcheck="false">';
    o += '<div class="row" style="margin-bottom:6px">' + COLORS.map(function (k, i) { return '<button type="button" data-col="' + i + '" aria-label="Colour ' + (i + 1) + '" aria-pressed="' + (i === pickColor) + '" style="width:22px;height:22px;padding:0;border-radius:50%;background:' + k + ";border:2px solid " + (i === pickColor ? "var(--text-primary)" : "transparent") + '"></button>'; }).join("") + "</div>";
    o += '<div class="row"><button type="button" id="cadd" class="go">Add calendar</button><button type="button" id="csync">Sync now</button></div>';
    o += '<p class="hint ' + (note ? "sst bad" : "") + '">' + (note ? esc(note) : "Google: Calendar settings, your calendar, Integrate calendar, copy the Secret address in iCal format. Apple: in the Calendar app, right-click a calendar, Share Calendar, tick Public Calendar, copy the link. Treat these links like passwords. Google and Apple can take minutes to hours to publish changes to a link.") + "</p></div></div>";
    box.innerHTML = o;
  }
  function place() { var r = gear.getBoundingClientRect(); box.style.top = (r.bottom + 8) + "px"; box.style.left = Math.max(8, Math.min(innerWidth - 348, r.right - 340)) + "px"; }
  function put(body) {
    note = "";
    return fetch("/api/settings", { method: "PUT", headers: HJ, body: JSON.stringify(body) }).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
      .then(function (j) { settings = j; sources = j.calendars || []; stateFrom(j); return load(); })
      .catch(function (e) { note = String(e.message || e); })
      .then(render);
  }
  box.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.t) { setTheme(t.dataset.t); render(); return; }
    if (t.dataset.col) { pickColor = +t.dataset.col; var keep = [box.querySelector("#cn1").value, box.querySelector("#cl1").value]; render(); box.querySelector("#cn1").value = keep[0]; box.querySelector("#cl1").value = keep[1]; return; }
    if (t.id === "ghs") { var body = { github: { login: box.querySelector("#ghl").value } }, tok = box.querySelector("#ght").value; if (tok.trim()) body.github.token = tok; t.textContent = "Saving"; put(body); return; }
    if (t.id === "ghc") { put({ github: { clearToken: true } }); return; }
    if (t.dataset.rm) { put({ calendars: sources.filter(function (s) { return s.id !== t.dataset.rm; }).map(function (s) { return { id: s.id, name: s.name, color: s.color }; }) }); return; }
    if (t.id === "cadd") {
      var name = box.querySelector("#cn1").value.trim(), url = box.querySelector("#cl1").value.trim();
      if (!url) { note = "Paste the calendar link first."; render(); return; }
      t.textContent = "Adding";
      put({ calendars: sources.map(function (s) { return { id: s.id, name: s.name, color: s.color }; }).concat([{ name: name || "Calendar", url: url, color: COLORS[pickColor] }]) }); pickColor = (pickColor + 1) % COLORS.length; return;
    }
    if (t.id === "csync") { t.textContent = "Syncing"; syncNow().then(render); return; }
  });
  gear.addEventListener("click", function (e) { e.stopPropagation(); if (settingsOpen()) { box.style.display = "none"; return; } render(); place(); box.style.display = "block"; });
  document.addEventListener("click", function (e) { var path = e.composedPath ? e.composedPath() : []; if (path.indexOf(box) < 0 && path.indexOf(gear) < 0) box.style.display = "none"; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") box.style.display = "none"; });
  window.addEventListener("resize", function () { if (settingsOpen()) place(); });

  load();
})();
</script>
</body>
